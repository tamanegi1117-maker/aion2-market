<style>
/* Same dark palette as the market board so the two pages feel like one site. */
:root {

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 var(--font); }
a { color: var(--accent); }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 16px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site { display: flex; gap: 6px; margin-bottom: 14px; }

.lead { margin: 4px 0 14px; color: var(--muted); font-size: .9rem; }

/* Sticky bar: tabs + search */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tabs button { flex: none; font: inherit; font-size: .9rem; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--panel2); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

/* Table of contents for the open document */
.toc { margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.toc a { font-size: .8rem; text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.toc a:hover { color: var(--fg); border-color: var(--muted); }

/* Rendered markdown */
.doc { margin-top: 8px; }
.doc h1 { font-size: 1.4rem; margin: 18px 0 6px; }
.doc h2 { font-size: 1.15rem; margin: 30px 0 10px; padding: 6px 12px; background: var(--panel); border-left: 4px solid var(--accent); border-radius: 4px; scroll-margin-top: 110px; }
.doc h2.key { border-left-color: var(--gold); background: var(--gold-bg); color: var(--gold); }
.doc h3 { font-size: 1rem; margin: 20px 0 8px; color: var(--accent); scroll-margin-top: 110px; }
.doc h4 { margin: 14px 0 6px; scroll-margin-top: 110px; }
.doc p, .doc li { overflow-wrap: anywhere; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li { margin: 2px 0; }
.doc code { background: var(--panel2); border-radius: 4px; padding: 0 4px; font-size: .88em; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.doc strong { color: #fff; }
.tw { overflow-x: auto; margin: 8px 0 12px; border: 1px solid var(--line); border-radius: 8px; }
.doc table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.doc th, .doc td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 6em; }
.doc th { background: var(--panel2); color: var(--muted); font-weight: 600; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
.doc tbody tr:nth-child(even) td { background: rgba(255,255,255,.02); }
.doc a.tab-link { cursor: pointer; }

/* Search results */
.results { margin-top: 14px; display: grid; gap: 8px; }
.results .none { color: var(--muted); }
.hit { display: block; text-decoration: none; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.hit:hover { border-color: var(--accent); }
.hit .where { font-size: .8rem; color: var(--accent); }
.hit .snip { font-size: .88rem; overflow-wrap: anywhere; }
mark { background: var(--mark); color: #fff; border-radius: 2px; padding: 0 1px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--mark); } }
.foot { margin-top: 40px; color: var(--muted); font-size: .8rem; }

const GUIDE = {"built":"2026-10-24 20:43","docs":[{"id":"home","tab":"はじめに","title":"目次と最近の変更","file":"00_目次.md","md":"# AION2 まとめの目次(2026-10-24 更新)\n\n同じ話をしていたまとめを、テーマごとに1本ずつにまとめ直し、10/24 時点の情報で新しくした。迷ったら、まずこのページを開く。\n\n| テーマ | まとめ | 中身 |\n|---|---|---|\n| テンプラー | [テンプラー_まとめ](\u003c1_テンプラー/テンプラー_まとめ.md\u003e) | スキルの順番と特化、パッシブ、スティグマ、マクロと回し方、装備の刻印、アルカナで狙うスキル、種族理解度、ディーヴァニオン、狩り、翼・称号、PvP |\n| 成長 | [成長とシステムのまとめ](\u003c2_成長とシステム/成長とシステムのまとめ.md\u003e) | IL の上げ方、10/21 パッチと今後の予定、戦闘力の上げ方、日課・週課、悪夢、覚醒戦、強化・刻印・継承の仕組み、韓国版の今 |\n| 成長 | [アルカナのまとめ](\u003c2_成長とシステム/アルカナのまとめ.md\u003e) | 仕組み、強化の経験値表、神秘的な結晶、いらないカードは強化か抽出か |\n| 相場と製作 | [相場と製作のまとめ](\u003c3_相場と製作/相場と製作のまとめ.md\u003e) | 今買う・売る物(10/24 夜の相場)、作るか買うか、ロングソードを IL102 まで作る費用、リング・ネックレス、売り買いのコツ |\n| ペット | [魔族側にしかいないペットと狩場](\u003c4_ペット/魔族側にしかいないペットと狩場_2026-10-23.md\u003e) | 天族側に出ないペット33種を、時空の亀裂で回る順番①〜⑪に。地図は Th3Ruthless さんのサイト https://t3r-aion2-petfarming.netlify.app/ |\n| ほかの職業 | [レンジャー・チャンター・クレリックのビルド](\u003c5_ほかの職業/レンジャー・チャンター・クレリックのビルド_2026-10-23.md\u003e) | スキルの上げ方、特化の番号、スティグマ、マクロ |\n| ツール | [ツールのまとめ](\u003c6_ツール/ツールのまとめ.md\u003e) | GameWith・questlog.gg など、DPS メーター、NotMeter の入れ方と設定 |\n| 共通 | [用語対応表](用語対応表.md) | 英語 → アジアサーバーの日本語名 |\n\n- 相場は毎日 **相場ボード** https://tamanegin.github.io/aion2-market/ で見る(自動で更新される)\n\n## 10/24 の見直しで変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| テンプラーのスティグマ | ボス用に挑発・保護のシールド・戦場の旗・高潔の甲冑など複数の型 | **高潔の甲冑 Lv15 と挑発は固定**、残りは破滅のシールド・戦場の旗(Lv20 から)・保護のシールド(Xia 10/19) |\n| 防御低下(衰弱の猛打・処刑の剣) | 意見が割れていた | 使わないが多数意見(Ulfhednar だけ使う) |\n| 装備の刻印 | ― | 強打は優先が最後(ボスの強打抵抗を超えるまでほぼ効かない)。防具のパッシブは激昂 |\n| 強化 | +10 で十分 | **低い IL の装備を +15 にしてから継承**すると安い |\n| 製作の費用 | ロングソード IL102 まで約2.1億(10/14) | **約2.25億**(煌めく素材の値上がり)。自分の次の段(IL94)は約9,130万 |\n| 怒りの素材 | 自我・意志は早めに確保 | **買うのは待つ**(遠征「難しい」で出るようになった。アリエルは他鯖より30〜70%高い) |\n| 金の材料 | ロングソードは作るか買うかほぼ同じ | **買う**(1,550万。10/14 の 2,400万から下がった) |\n| 遠征「難しい」 | 10/21 に追加 | IL2600、復活3回、4分で激昂。賢者の石1%、アリエルの欠片(ディーヴァニオン結晶30個まで) |\n| アルカナ | ― | IL2500(4段階目)から本格的に。+3 までは強化、残りは抽出 |\n| 用語 | Double Chance=二重攻撃 | **強打** |\n"},{"id":"templar","tab":"テンプラー","title":"テンプラー まとめ","file":"テンプラー_まとめ.md","md":"# テンプラー まとめ(2026-10-24 最新)\n\n10/14〜10/24 に作ったテンプラーのまとめ6本(早見表、詳細版、Lv16を目指すスキル、魂刻印、種族理解度、アルカナのおすすめスキル)を1本にまとめ、10/19〜10/23 の動画で新しくした。古い6本は `_古い版/` にある。\n名前は questlog.gg の日本語版データで確かめた正式名。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 最優先 | **審判を Lv16 → Lv20**。Lv16 で待ち時間がなくなり、Lv20 で特化が3つ。20 を超えても火力は少し伸びる(Xia) |\n| 2番目 | 懲罰 か 猛烈な一撃 を Lv20(人による) |\n| スティグマ | **高潔の甲冑 Lv15 と 挑発 は固定**。残り2枠は 破滅のシールド(Lv5)・戦場の旗(Lv20 になってから)・保護のシールド(激昂が切れるとき)から |\n| 防御低下 | 衰弱の猛打・処刑の剣は**使わない**が多数意見(貫通でボスの防御はほぼ0) |\n| パッシブ | 激昂 \u003e 侮辱の咆哮・断罪の加護 \u003e 衝撃的中 |\n| 装備の刻印 | 戦闘速度が一番。防具・アクセサリーのパッシブは激昂。リングはスキル(審判 \u003e 懲罰 \u003e 猛烈な一撃 \u003e 連続乱打) |\n| アルカナ | 審判は聖杯と羊皮紙だけに付く。聖杯は審判を指定して作る |\n| 狩り | 破滅のシールド Lv15+審判 Lv16+殲滅 で一撃ずつ倒して回る |\n\n---\n\n## 1. スキル\n\n### 1-1. 優先順と目標\n| 優先 | スキル | 目標 | 理由 |\n|---|---|---|---|\n| 1 | **審判** | 16 → 20 | Lv16(特化5)で待ち時間なし。火力の約半分。Lv20 で特化3つ |\n| 2 | 懲罰 | 16 → 20 | 2番目の火力。懲罰の強化(+20%)をずっと切らさない |\n| 2 | 猛烈な一撃 | 16 → 20 | 左クリックの基本攻撃。1発ごとに庇護の一撃の待ち時間 −2秒。Lv16 で4段目の追撃 |\n| 4 | 連続乱打 | 16 | 審判が使えないときだけ打つ。懲罰の待ち時間も回す |\n| 5 | 庇護の一撃 | 16 | 審判を開く技 |\n| 6 | 殲滅 | 12〜16 | 破滅のシールドでリセットして打つ |\n| 7 | シールド強打 | 12〜16 | 審判を開く技 |\n| — | 閃光乱舞 | 使わない | 全員一致 |\n| — | 衰弱の猛打 | PvE では使わない | 3章 |\n\n- 審判を開く技は4つ: シールド強打、庇護の一撃、シールド突撃、破滅のシールド(Xia)\n- NoBS の実測(月額課金のみ): IL1,600 で約1.2万DPS → 猛烈な一撃・連続乱打 Lv16 で約2万 → 審判・懲罰も Lv16 で約4〜4.5万\n\n### 1-2. レベルの上げ方\n| 方法 | 上がる量 |\n|---|---|\n| スキルポイント(知恵の石など) | 10 まで |\n| ディーヴァニオン | 主要スキル +4 |\n| リング・武器・ガーダーの刻印 | 1行で +1。**リング2つで +2** が普通(武器・ガーダーにはスキルを付けない) |\n| アルカナ | 残りの +4 をここで取る(Xia) |\n\n→ 10+4+2=16。Lv20 には アルカナで +4 が要るので、Lv20 にできるのは現実的に1〜2個(Xia)\n\n### 1-3. 特化(ボス用)\n| スキル | Lv16 未満 | Lv16 以降 |\n|---|---|---|\n| 審判 | 追加ダメージ+確定クリティカル | **待ち時間なし**+確定クリティカル(Lv20 で3つとも) |\n| 猛烈な一撃 | 庇護の一撃の待ち時間 −2秒+多段ヒット | 4段目の追撃 |\n| 懲罰 | 継続ダメージ+α | 確定クリティカル+回避無視 |\n| 連続乱打 | 懲罰の待ち時間 −1秒+追加ダメージ | 同じ |\n| 庇護の一撃 | 待ち時間短縮+1つ | 1番と5番 |\n| 殲滅 | 行動不能無効の敵に +100%+待ち時間 −10秒 | 狩りでは多段ヒット+待ち時間 −10秒 |\n| 捕獲 | 対象へ移動+バリア | 狩りでは「撃破で待ち時間リセット」 |\n| シールド突撃 | 射程 +10m+待ち時間 −10秒 | 狩りでは範囲化 |\n\n- 詳しい特化の番号は Xia の questlog.gg のビルドにある(動画の説明欄)\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 理由 |\n|---|---|---|\n| 1 | **激昂** | 前方攻撃のダメージが上がり、ガードするたびにパーティー全体の PvE ダメージも上がる。一番大事(全員一致) |\n| 2 | 侮辱の咆哮 | 前から当てると強くなる。後ろから殴らない |\n| 2 | 断罪の加護 | 侮辱の咆哮と同じくらい(aLuckyRO) |\n| 4 | 衝撃的中 | 強打(ダメージが2倍になる確率)が上がる |\n| 5 | HP強化、鉄壁防御 | 防御系。余裕があれば |\n| PvP | 生存意志、苦痛遮断 | PvE では要らない |\n\n---\n\n## 3. スティグマ(グローバル版は4枠)\n\n### 3-1. 1つずつの評価(Xia 10/19。上位のテンプラー数人と相談した結論)\n| スティグマ | 評価 | 目標 |\n|---|---|---|\n| **高潔の甲冑** | **必須**。激昂と侮辱の咆哮の効果 +50%。外さない | Lv15 にして放置 |\n| **挑発** | **必須**。Lv5 で萎縮(相手の PvE ダメージ耐性 −10%)。パーティー全体の火力が上がる | Lv5。15・20 で待ち時間と持続が伸びる |\n| 破滅のシールド | 審判を3秒出す。投資が少ないうちは強い | Lv5 で十分(狩り用は Lv15) |\n| 保護のシールド | 激昂を100%切らさない。ボスの攻撃が少ないときに。ヒーラーも楽 | Lv5(+1回) |\n| 戦場の旗 | Lv20 で強い。それまでは稼働時間が短い | Lv20 になってから入れる |\n| 神の懲罰 | 悪夢で少し使える程度 | 低い |\n| 衰弱の猛打・処刑の剣 | 防御低下は火力にならない(貫通でボスの防御はほぼ0になるため) | 使わない |\n\n- 注意: 破滅のシールドは Lv1 でも殲滅がリセットされる**バグ**がある。不具合の利用は規約違反で処分の対象になりうるので、Lv5 まで上げて使う(Xia)\n\n### 3-2. 構成\n| 用途 | 4枠 |\n|---|---|\n| ボス(一番火力が出る) | 高潔の甲冑、挑発、戦場の旗(Lv20)、破滅のシールド |\n| ボス(激昂が出ないとき) | 破滅のシールド → 保護のシールド に替える |\n| ボス(戦場の旗が Lv20 未満) | 戦場の旗 → 保護のシールド に替える |\n| 狩り・覚醒戦・デイリー | **破滅のシールド Lv15**、高潔の甲冑、挑発、+1(何でもよい) |\n| PvP 1対1 | 高潔の甲冑 Lv15、破滅のシールド Lv5、ネザカンのシールド、二重鎧 |\n| PvP 5対5 | 拿捕、神の懲罰、戦友保護、破滅のシールド |\n| PvP 大規模戦 | 高潔の甲冑 Lv15、拿捕 Lv15、破滅のシールド Lv5、戦友保護か二重鎧 |\n\n- 意見の割れ: Ulfhednar(10/18、Sahara のビルド)は 破滅のシールド・高潔の甲冑・戦場の旗・保護のシールドで、**衰弱の猛打(防御 −25%)もマクロに入れている**。Xia は「防御低下が効くデータがあれば考えを改める」と言っている\n\n---\n\n## 4. マクロと回し方(ボス)\n\n### 4-1. マクロ\n| 項目 | 内容 |\n|---|---|\n| キー | 設定 → キー設定 → 一般 → ゲームプレイ「マクロ」を右クリックに。左クリックは猛烈な一撃 |\n| 押し方 | 左クリックと右クリックを押し続ける |\n| 列1 | **挑発** → 審判 → シールド強打 → 庇護の一撃 → 連続乱打(挑発を先頭にすると審判を無駄にしない。Xia) |\n| 列2 | 殲滅 |\n| 手で押す | 懲罰(溜める)、戦場の旗、高潔の甲冑、破滅のシールド、シールド突撃、保護のシールド |\n| 遅延 | ping 50 未満は 10 ミリ秒、それ以上は 50 ミリ秒 |\n\n- 戦場の旗はマクロに入れない(雑魚で使うと 90 秒待つことになる)\n- 段の並びは字幕から起こしたもので、画面では確かめていない\n\n### 4-2. 回し方(Xia)\n1. 戦う前に高潔の甲冑\n2. ボスの範囲に入る直前に 戦場の旗 → **懲罰を MAX まで溜める**(途中で離すと弱い)\n3. シールド突撃で飛び込み、マクロと左クリックを押し続ける\n4. 庇護の一撃で出た審判が切れたら、すぐ破滅のシールド\n5. 懲罰は待ち時間が戻り次第、審判を無駄にしない合間に打つ\n6. ボスが離れたら突撃で追う(審判が2秒ぶん出る)。回避したあとのシールド突撃も無駄にしない\n7. 保護のシールドを入れている場合は、20秒に1回、ボスの攻撃の直前に使って激昂を更新する\n\n---\n\n## 5. 装備の刻印(魂刻印)\n\n### 5-1. 能力値の優先順(Xia)\n**戦闘速度 \u003e ダメージ増幅・武器ダメージ増幅・多段ヒット的中・攻撃力増加 \u003e アクティブスキル・パッシブ \u003e 強打**\n- 強打を最後にするのは、ボスに強打の抵抗があり、それを超えるまでほとんど効かないため。超えると一気に伸びる\n- 命中とクリティカルは、必要な値(ルドラの要件は未発表)を先に満たす。満たしたら威力・攻撃力\n\n### 5-2. 部位ごと(上位20人の採用率は NotMeter 10/22、動画は Xia 10/19・Soulgrot 10/18・Ulfhednar 10/18 ほか)\n| 部位 | 狙う物 | 補足 |\n|---|---|---|\n| ロングソード・ガーダー | **戦闘速度・武器ダメージ増幅・ダメージ増幅・威力**(+多段ヒット的中) | 上位20人は5つとも100%。**スキルは付けない**(数値が一番大きい部位なので) |\n| ヘルム | 強打・攻撃力増加 | 受ける治癒量も強い(Soulgrot) |\n| ショルダー | クリティカル ダメージ増幅・強打 | |\n| トップス | ダメージ増幅(+完璧) | |\n| ボトムス | 攻撃力増加・完璧(+ダメージ耐性) | |\n| グローブ | **戦闘速度**・完璧 | |\n| シューズ | **移動速度**・完璧 | 移動速度は戦闘力が大きく上がる(Ulfhednar) |\n| マント | 強打・攻撃力増加(+完璧) | |\n| ネックレス | 攻撃力・命中・クリティカル(+ガード) | 動画は「戦闘速度」と言う(Xia・Soulgrot)が、上位20人にも GameWith の刻印表にもない。**未確認**。アミュレット(別の部位)の話と混ざっている可能性 |\n| イヤリング | ネックレスと同じ+移動速度 | |\n| **リング** | **スキル: 審判 \u003e 懲罰 \u003e 猛烈な一撃 \u003e 連続乱打** | 能力値よりスキル |\n| ブレスレット | 時間・幻想・知恵・破壊 | |\n\n- **防具とアクセサリー(リング以外)のパッシブは激昂を最優先**、次に 侮辱の咆哮・衝撃的中(Xia・Ulfhednar)\n- 敏捷・攻撃力・命中・クリティカルは「付いたら残す」くらい(aLuckyRO)。PvE では防御の能力値は要らない\n\n### 5-3. 安く揃える手順\n1. **拾った・買った唯一(金)の装備は、まず刻印して能力値を見る**。良い行が付いたら残す(Xia・notXeon)\n2. 良い行の付いた装備を **+15 まで上げてから継承**で本命に移す。IL の低い装備のほうが強化がずっと安い(IL86 は約2倍かかる)。取引所で低い IL の同じ部位を買い、刻印して良い行が2つ出るまで繰り返すのも手(Grobs 10/19、Reddit の方法)\n3. 1行ずつの振り直し(魂の調律)は最後の手段。1回90〜150万ギーナで、狙いが出る確率は約2%\n4. **装飾品は継承できない**。余った唯一の装備で直接振り直す\n5. 全部そろったら刻印の効果を100%に → 賢者の石で6枠目(武器は2個)。賢者の石の枠は継承で消えるので最後の装備だけ\n   - 賢者の石は**遠征「難しい」で1%**(平均100回に1個、取引不可)とシーズンショップ\n\nロングソードの刻印の確率(GameWith): ダメージ増幅 1.6%、戦闘速度・武器ダメージ増幅 3.2%、多段ヒット的中・威力 4.8%、各スキル約1.7%\n\n\n---\n\n## 6. アルカナ\n仕組みと「いらないカードは強化か抽出か」は `2_成長とシステム/アルカナのまとめ.md`。\n\n| カード | 能力値の種類(Xia) | 狙うスキル | 避けるスキル |\n|---|---|---|---|\n| 聖杯 | **活力**(時間=戦闘速度) | **審判**、激昂。次に懲罰・侮辱の咆哮・連続乱打 | 防御系、衝撃解除、苦痛遮断・生存意志 |\n| 羊皮紙 | どちらでもよい | **審判**、懲罰、猛烈な一撃、殲滅 | 衰弱の猛打、捕獲 |\n| コンパス | 活力(自由=命中) | **連続乱打**、シールド突撃、シールド強打、庇護の一撃 | 閃光乱舞、衝撃解除 |\n| 鐘 | **魔力**(破壊=攻撃力) | **激昂**、断罪の加護、侮辱の咆哮 | 守護の印章 |\n| 鏡 | **魔力**(知恵=強打) | **衝撃的中** | 生存意志 |\n\n- 審判が付くのは聖杯と羊皮紙だけ。羊皮紙と鏡は**砕けたアルカニス**、コンパスと鐘はデウス研究基地で出る\n- 聖杯を作るときに2つ指定するなら 審判+懲罰(aLuckyRO)\n- 4枚セットの効果は気にしない。カードの能力値のほうが得(Xia)\n- 神の能力値: 時間=戦闘速度、幻想=待ち時間短縮、知恵=強打、破壊=攻撃力増加。死(クリティカル)と自由(命中)も良い。ほかは PvE では関係ない(Xia)\n- 出典: Xia 10/19、aLuckyRO 10/20、Antochi 10/21\n\n---\n\n## 7. 種族理解度(ペットの能力値)\n種族理解度 = ペットの種族(知性・野性・自然・変形・特殊)ごとの9つの枠に能力値を付ける仕組み。\n\n| 枠 | おすすめ |\n|---|---|\n| **4番** | 種族ごとに違う「%で火力が上がる」枠。**一番大事。最初にここ**(下の表) |\n| 1・5番 | 最大攻撃力・追加攻撃力 |\n| 3・6・9番 | クリティカルか命中。命中が足りていればパワーシャードのダメージ(Xia) |\n| 7番 | ダメージ耐性 か PvE ダメージ耐性 |\n| 2・8番 | HP 増加(%) |\n\n| 種族 | 4番で狙う物 |\n|---|---|\n| 知性 | PvE ダメージ増幅 \u003e ダメージ増幅 |\n| 野性 | PvE ダメージ増幅・ダメージ増幅・武器ダメージ増幅 |\n| 自然 | PvE ダメージ増幅だけ(多段ヒット的中・完璧は罠) |\n| 変形 | **前方ダメージ増幅**(テンプラーは前から殴るので) ≧ PvE ダメージ増幅 |\n| 特殊 | **強打** |\n\n育て方\n1. **レベル10になるまで分析を続ける**(経験値はこれで入る)。それまでは、4番に高い数値が出たとき以外ロックしない\n2. 4番が決まったらロックし、ほかの種族の4番へ\n3. 4番が全部そろってから、自動分析で 1・5番の黄色の最大攻撃力、3・6・9番のクリティカル・命中を狙う(Xia)\n4. ロックするほど費用が上がる(ロックなし 結晶36個+9,000ギーナ → 5つで 172個+4.3万ギーナ)\n5. **5種族すべてレベル10で称号「Unbound by Genus」**(PvE ダメージ +4.5%、所持で +1%。全キャラ共通)\n- 「貫通」は今は選ばない(ボスの防御は貫通でほぼ0になっている)\n\n---\n\n## 8. ディーヴァニオン\n- 主要スキル(審判・懲罰・猛烈な一撃・殲滅・連続乱打)を先に取り、角(オレンジ)の戦闘速度・ダメージ増幅・待ち時間短縮・多段ヒットへ。パッシブは激昂・侮辱の咆哮・衝撃的中。小さいノードは攻撃力・クリティカル。防御とMPは後回し\n- 結晶の上限は今 416 点(Fubgun)。集め方は `2_成長とシステム/成長とシステムのまとめ.md` の3章\n- 10/21 から新しい盤「アリエル」(PvE ダメージ増幅、ボスへのダメージなど)。遠征「難しい」のアリエルの欠片から結晶を作れる(キャラごと30個まで)\n\n---\n\n## 9. 狩り・デイリーダンジョン\n| 項目 | 内容 |\n|---|---|\n| 型 | **破滅のシールド Lv15**(敵を倒すと待ち時間が戻る)+**審判 Lv16**+殲滅。破滅のシールドで飛び込むたびに審判が出て、ほぼ一撃で倒せる(Leonis 10/21・Xia・Ulfhednar) |\n| 簡単な型 | 捕獲 Lv8 の「撃破で待ち時間リセット」で引き寄せる。すぐ組めるが遅い |\n| 稼ぎ(Leonis) | アビスで1時間に生のギーナ約100万、アビスポイント約5万、職人の精錬石約10個、達人の精錬石1〜2個、唯一の装備3〜4個。合わせて約400万ギーナ分 |\n| 設定 | 「スキル使用時の自動ターゲット」ON、ターゲット探索は「カメラ前方」。「スキル使用時の追跡」は狩りのときだけ ON(普段は勝手に歩くので OFF) |\n| リセット | 自分でとどめを刺したときだけ。PvP では効かない |\n| 狩り場 | 不滅の島の浜辺(Lv50)、アビス下層 |\n\n**デイリーダンジョン**: 中央に立つ。精鋭(300点)が出たらすぐ倒す。開始時の効果は移動速度を優先。移動速度の称号・靴・スクロールを準備\n\n---\n\n## 10. 翼・称号\n| 種類 | おすすめ |\n|---|---|\n| 翼 | 一番: タリスラの翼(シーズンショップ 21万ポイント)。次: 森の精霊の翼(ボスに強い・安い)、悪夢の翼、ダークヴェールの翼(所持で +1%) |\n| 称号(攻撃) | Unbound by Genus(種族理解度を全部レベル10)。それまでは Guardian of Altgard |\n| 称号(防御) | Saint of Altgard(アルトガルドのモノリスでレベル30) |\n| 称号(その他) | Through Hell and Back(封印ダンジョンを全部) → Empty Closet(外見を大量に集める。最終) |\n- 翼と称号の日本語名は未確認(英語のまま)\n\n---\n\n## 11. PvP(要点)\n| 項目 | 内容 |\n|---|---|\n| 特化を替える所 | 衰弱の猛打=回復量 −60%(PvP では強い)、捕獲=バリア+状態異常抵抗を下げる、殲滅=転倒+待ち時間、懲罰=継続ダメージ+HP 吸収 10% |\n| パッシブ | 激昂・衝撃的中を最大、生存意志も最大(大規模戦で倒される原因は拘束の連鎖) |\n| マクロ | PvE と同じ審判の列だけ。拘束技(捕獲・拿捕・神の懲罰)と移動技は手で |\n| 1対1 の流れ | 高潔の甲冑 → 破滅のシールドで入る → 左右クリック → 相手の気絶技を見てから懲罰 → 被弾が増えたら二重鎧かネザカンのシールド |\n| 5対5 の流れ | 捕獲でヒーラーか火力職を釣る → 逃げたら拿捕 → 範囲気絶 → 溜め懲罰 |\n| 準備 | アビスの羽根で Lv16、PvP 用ディーヴァニオン(金は PvP ダメージ耐性、青は状態異常抵抗) |\n\n---\n\n## 12. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| 防御低下(衰弱の猛打・処刑の剣) | 効かない(Xia・Ashura・mattshew・trueeevil)/効く(Ulfhednar・Leonis) |\n| 2番目の Lv20 | 懲罰(aLuckyRO・Ashura)/猛烈な一撃(Xia は どちらでも) |\n| 戦場の旗 | Lv20 からでないと弱い(Xia)/最初から入れる(Ulfhednar) |\n| ネックレスの戦闘速度 | 付く(Xia・Soulgrot)/上位20人にも刻印表にもない(データ) |\n\n## 13. 注意\n- 外部のマウスマクロは NCSOFT が認めたことはない。ゲーム内マクロだけが無難\n- 低 ping=火力 という宣伝(ExitLag など)はスポンサー込み\n- 審判の連打を外部ソフトで速める方法(Ashura の旧版)は規約上危ない\n\n## 14. スキル名の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Vicious Strike=猛烈な一撃、Pummel=連続乱打、Poach=捕獲、Shield Smite=シールド強打、Judgment=審判、Flash Rampage=閃光乱舞、Debilitating Smash=衰弱の猛打、Warding Strike=庇護の一撃、Shield Rush=シールド突撃、Annihilate=殲滅、Punishment=懲罰、Defiance=衝撃解除 |\n| パッシブ | Fury=激昂、Insulting Roar=侮辱の咆哮、Punishing Benediction=断罪の加護、Impact Hit=衝撃的中、Enhance Health=HP強化、Ironclad Defense=鉄壁防御、Warding Shield=庇護のシールド、Guarding Seal=守護の印章、Survival Willpower=生存意志、Block Pain=苦痛遮断 |\n| スティグマ | Noble Armor=高潔の甲冑、Taunt=挑発、Doom Shield=破滅のシールド、Shield of Protection=保護のシールド、Battlefield Banner=戦場の旗、Empyrean Lord\u0027s Punishment=神の懲罰、Executing Blade=処刑の剣、Nezekan\u0027s Shield=ネザカンのシールド、Second Skin=二重鎧、Comrade in Arms=戦友保護、Grapple=拿捕、Armor of Balance=均衡の鎧、Assault Fury=強襲猛撃 |\n| 状態 | Shrink=萎縮、Stagger=グロッキー、Block=ガード、Double=強打 |\n\n## 15. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Xia「テンプラー:完全PvE\u0026攻略ガイド」(cvv5gr19Zoo) | 10/19 | スキル・スティグマ・マクロ・刻印・アルカナ・種族理解度の最新版 |\n| Ulfhednar「テンプラー DPS ビルド」(c1T9XTyzw0w) | 10/18 | Sahara のビルド。衰弱の猛打を使う派 |\n| Leonis「壊れビルドで数百万ギーナ」(-7kEyKqn2w4) | 10/21 | 狩りビルド |\n| aLuckyRO「全8クラスの Lv16〜20 スキル」(lKmqp1HLaIw) | 10/20 | アルカナ |\n| Grobs「安価な強化術+ソウルバインド」(2vDVa75Y3XA) | 10/19 | 低 IL で +15 にしてから継承 |\n| Soulgrot「装備を正しく強化する方法」(jI9i3ChAAQc) | 10/18 | 部位ごとの刻印 |\n| NotMeter「クラス別装備・スキル構成」 | 10/22 | 上位20人の採用率 |\n| 以前の出典(Ashura、NoBS、StingKnight、trueeevil、Antochi、mattshew ほか) | 10/12〜10/21 | `_古い版/` の各まとめ |\n"},{"id":"growth","tab":"成長","title":"成長とシステム まとめ","file":"成長とシステムのまとめ.md","md":"# 成長とシステム まとめ(2026-10-24 最新)\n\n「IL2100以降の上げ方」「悪夢・覚醒戦・アルカナ・装備厳選・クラフト」「AION2 日課週課まとめ」「先行サーバー(韓国・台湾)の今」と、10/21・10/14 の動画まとめを1本にし、10/21 パッチと 10/19〜10/23 の動画で新しくした。古い版は `_古い版/` にある。\nアルカナは `アルカナのまとめ.md`、製作は `3_相場と製作/相場と製作のまとめ.md`。\n\n## 0. 今の道筋(シーズン1は 12/16 まで)\n| IL | やること | 次 |\n|---|---|---|\n| 2100 | 獰猛な角岩窟(防具・ガーダー)と炎の神殿(武器・アクセサリー)。ここの装備を長く使う | 2200 |\n| 2200 | 超越3段階目で青カードをそろえる(金は約12%なので深追いしない) | 2500 |\n| 2500 | **超越4段階目で金カード(約60%)**。主力スキルを Lv20 へ。製作装備に取りかかる | 2600 |\n| **2600** | **遠征「クラオ洞窟」「ドラウプニル」の難しい**(10/21 追加)。怒りの素材・賢者の石・アリエルの欠片・絵画 | 2700〜2800 |\n| 2700〜2800 | 聖域(10人レイド)。台湾版は IL2700 から。グローバル版はまだ(NoBS の予想ではシーズン1の最後) | 次のシーズン |\n\n- 戦闘力の大半は装備以外(スティグマ・ディーヴァニオン・ペット・アルカナなど)から来る。装備を全部外しても約10.7万残る(Fubgun、19.5万の人)\n- 野良パーティーは戦闘力で選ばれる。IL2100 で9.5万〜10万、炎の神殿は10〜12万が目安(10/14 時点)\n\n---\n\n## 1. 10/21 のパッチ(グローバル版)\n| 変更 | 中身 |\n|---|---|\n| 遠征「難しい」 | クラオ洞窟・ドラウプニルに追加。**IL2600**、復活は3回まで、最後のボスは**4分で激昂** |\n| 報酬 | 箱1つのギーナが 40万 → **48万**。報酬枠5: **怒りの思念 66%、意志・自我 16%ずつ**(今まで遠征で出にくかった)。装備は通常と同じ IL54 の物 |\n| 新しい物 | **賢者の石:啓示(刻印)** 1%(平均100回に1個、取引不可。装備に6枠目)。**アリエルの欠片** 毎回60〜90個(物質変換でディーヴァニオン結晶に。キャラごと30個まで。その後は強化石5個に)。**絵画「怒りのクラオ」「怒りのドラウプニル」**(高く売れる見込み) |\n| 注意 | 新しい物は**最後のボスだけ**が落とす。途中のボスは通常と同じ |\n| ディーヴァニオン | 新しい盤「アリエル」(PvE ダメージ増幅・耐性、ボスへのダメージなど) |\n| イベント「挑戦に立ち向かえ」 | 12/16 まで。そよ風商会の特殊で復活石 30個を2.5万ギーナ(週1回、サーバーごと)。もう30個は5万ギーナ |\n| アビス | 入れる人数が増えた。下層の次元コアとボスの HP が増えた |\n| 採集素材 | 出品の制限を一部のプレイヤーで緩和 |\n| 職業 | チャンター(回転撃の表示)、ソーサラー(冷気の嵐・炎の壁の不具合)の修正 |\n\n### 今後の予定(NoBS の予想。確定ではない)\n- 台湾版にある「難しい」は、ほかの遠征にも順に来る見込み。難しいは金装備の出る率が通常の2倍(20%)で、英雄装備も入る\n- 製作の上位素材も難しいのほうが出やすい → 製作の費用は下がっていく見込み\n- 超越はシーズン1の間は今のまま。次のシーズンで新しいボス\n\n## 2. 韓国版の今(グローバル版への影響)\n| 韓国で起きたこと | グローバル版で考えること |\n|---|---|\n| ゲーム内通貨の現金相場が約3か月で65%下がった | 今の高い相場は下がっていく可能性が高い |\n| パッチで装備や素材の価値が急に下がった(射程の付いた製作武器、精錬石の緩和、PvP 装備) | 調整されそうな物に一度に大きく投資しない |\n| 人が離れている(9月ごろから) | 強くなるのを急ぎすぎない |\n| ハロウィンイベント(遠征・超越の強化石1.5倍、キャンディの鍵でオードエネルギーなどを選べる) | グローバル版に来れば、強化石・オード・オリハルコンは下がりやすい |\n- グローバル版は韓国版の失敗を直して始まった(製作装備は継承製作でしか上げられず売れない、割合の能力値を下げた、クリティカルの上限50%など)\n\n---\n\n## 3. 戦闘力の上げ方(Fubgun 10/21)\n| 源 | 中身 | 優先 |\n|---|---|---|\n| **スティグマのかけら** | **アビスが一番**(4段階×50=200個)。シューゴフェスタと悪夢は35個ずつ。Lv20 のスティグマ1つで戦闘力約1.3万 | 高 |\n| **ディーヴァニオン結晶** | 上限 416 点。悪夢(先に結晶を買う)、シューゴフェスタ(1・2段目を先に → かけら → 結晶)、**封印ダンジョン(1つで2個)**、**地域クエスト(1つで1個)**、アリエルの欠片(30個まで) | 高 |\n| ペット・種族理解度 | 知性ペット Lv3 で威力1・クリティカル2、自然ペットで正確1。種族理解度を全部 Lv10 で称号(PvE ダメージ +4.5%、所持で +1%) | 高 |\n| アルカナ | IL2500 から本格的に | 中 |\n| 万神殿 | 絵画(遠征・征服のボス、シューゴフェスタ)と、**悪夢の像**(各ボス10回+ジケル作戦1回で購入。能力値 45 が3つ) | 中 |\n| 称号・クローゼット | 外見を合成すると増える | 低 |\n| 翼 | 森の精霊の翼(PvE ダメージ +3.5%)、ダークヴェールの翼(所持で +1%)、シーズンの翼 | 低(ギーナで買える) |\n\n**アビス回廊**: 自陣営が攻城でボスを倒すと開く。2分の PvE で最大約3万アビスポイント。攻城の後(水・土・月)にリセット。メインキャラのアビスの時間は、オード集めよりアビスポイント(かけら)に使う(Fubgun)\n\n---\n\n## 4. 日課・週課(リセットは日次・週次とも 16:00。週は水曜)\n### 毎日\n| やること | 回数 |\n|---|---|\n| 使命 | 1日5回(サーバー共有、1キャラで) |\n| 悪夢 | 毎日2回分たまる(最大14) |\n| オードエネルギー | 3時間ごとに15回復。上限を超える前に使う |\n| 次元侵略の鍵・シューゴフェスタの鍵 | 上限前に使う |\n| 超越・征服の報酬回数 | 超越は12時間ごと+1(最大14)、征服は8時間ごと+1(最大21) |\n\n### 毎週\n| やること | 回数 |\n|---|---|\n| 覚醒戦 | **キャラごと3回**(週の終わり、装備が一番強いときに) |\n| デイリーダンジョン | 14回(入場時に消費) |\n| 遠征 | ダンジョンごとに7回 |\n| 戦場・指令・アビス指令 | 勝利3回・12回・20回 |\n| **物質変換のオードエネルギー** | **キャラごと20回**(10/14 のパッチで変更。以前は「キャラ4回+サーバー16回」) |\n| アビスの滞在時間 | 7時間(メンバーシップで延長) |\n| 週ミッション・シーズンミッション | 超越・悪夢・アビスの項目は日課と一緒に |\n| 復活石(イベント) | 2.5万ギーナで30個(12/16 まで) |\n\n**注意: 報酬を開けずに出るのが週10回を超えると、水曜まで征服と超越に入れなくなる**(Leonis が確認。ドラウプニル像のために「9回で止めて、10回目は必ず開ける」)\n\n### サブキャラ(Moxsy 10/19)\n- サブキャラを Lv22 にしておくと、遊ばない間もオードエネルギーがたまる\n- 低い遠征(クラオ洞窟・ドラウプニル。IL700)は怒りの思念が出やすい。サブキャラで回してメインに渡す(素材は拘束なし)\n- サブキャラごとにバトルパス(オードが多い)とオードの買い足しができる。ギーナをキューナに換えて買えば現金は要らない\n- 種族理解度とペットは全キャラ共通\n\n---\n\n## 5. 悪夢\n| 項目 | 内容 |\n|---|---|\n| 回数 | 毎日2回分(最大14)。倒したことのある段は即時クリア券で済ませられる |\n| ボス | 7体。左から順に解放: 門番ピノピ・怒れるフェルク → 要塞守護者ノトゥン/ファフニル・ジゼル → ジェロッド → ジケル |\n| 解放 | 前のボスを難易度10まで倒すと次が出る |\n| 報酬 | 夢幻の破片。**初めて倒した段の報酬がずっと多い**(難易度9: 初回840個、2回目以降200個) |\n| 一番の目的 | ジケルを倒すと**ジケルの像**(万神殿)。破片約14,000個 |\n| 交換所 | 突破石、魂の書とその初期化の書、ペットの結晶、**ディーヴァニオン結晶(最大50個)**、知恵の石、クラスルーン、**スティグマのかけら**、翼、衣装 |\n\n- ボスは「1,1,1 → 2,2,2」と均等に上げて初回報酬を取る(Moxsy)\n- ディーヴァニオン結晶を先に買い、そのあとかけら(Moxsy・Soulgrot・Fubgun)\n- ジケル対策: 地面割りは詠唱が残り1秒でジャンプして滞空、斬撃(出血)は背後に立って浄化(BoredAF)\n\n## 6. 覚醒戦\n| 項目 | 内容 |\n|---|---|\n| 回数 | キャラごと週3回 |\n| 難易度 | 7段階。ハードは IL2000、エクストリームは IL2500 |\n| 報酬 | 魔石・霊石の箱、**成長のペット箱(スコア7,000以上で20個、6,000で17個)**、突破石 |\n| スコア | ほぼタイムで決まる。**ハードは「完璧クリア2,100点+残り1秒につき3点」**(韓国版のコメント)。4,000点には約3分26秒以内のクリア |\n| 結晶 | 1,000点・3,000点・4,000点・5,000点で神秘的な結晶(アルカナ用) |\n\n- テンプラーは破滅のシールド Lv15 で回ると速い(Aragon はハード約2分40秒で4,000点)\n- 未確認: 「完璧」の条件、空虚の螺旋体を壊すと点が増えるか、死ぬと回数が減るか\n\n---\n\n## 7. 装備の強化・刻印・継承(仕組み)\n部位ごとに狙う能力値は `1_テンプラー/テンプラー_まとめ.md` の5章。\n\n### 強化\n| 段階 | 内容 |\n|---|---|\n| +10 まで | 100% 成功 |\n| +11〜+15 | 失敗すると材料だけなくなる(装備は残る)。費用は1回30万〜150万と急に上がる。IL86 の装備は IL36 の装備の約2倍 |\n| +16 以上(突破) | 突破石と強化石を使う。星1つで IL+5 |\n| クラスルーン | **失敗すると壊れる唯一の装備**。+1 が安全(Ulfhednar)。壊れたら悪夢の交換所で買い直す |\n\n- IL2500 までは+10 で十分。+15 以上は長く使う装備(製作装備)だけ(Duky・Strylander)\n- **安く上げる方法**: IL の低い同じ部位を +15 にして、刻印も良い物にしてから、本命に継承する(Grobs 10/19)\n- サブキャラのギーナ(シーレンティウムを売った拘束ギーナ)と強化石で、メインの装備をサーバー倉庫経由で強化できる(Moxsy)\n\n### 刻印と継承\n| 操作 | 中身 | 要る物 |\n|---|---|---|\n| シンク | 選んだ1行を振り直す(壊す装備が要る) | 唯一の装備1つ |\n| 魂刻印(数値上げ) | 能力値の数値を上げる | 魂の書(使うたびに必要数が増える。50 → 最大540) |\n| リセット | 全部の行を振り直す | 初期化の書(貴重。製作装備用にとっておく) |\n| 追加の行 | 刻印率100%で6枠目 | 賢者の石(遠征「難しい」で1%、シーズンショップ) |\n| 継承 | 古い装備の強化値と刻印を、IL が1以上高い同じ部位に移す(移す元で上書き) | 継承用の石(物質変換で唯一の装備1つから) |\n\n- 追加の行にはスキルを狙う(スキルの行は最初から100%なので数値上げが要らない)\n- 刻印率を100%にすると行を変えられなくなる。変えたい行は先に振り直す\n- 唯一の装備は振り直しの材料としてずっと要る。今は武器70万・防具55万ほどで安い(Soulgrot、10/18)。遠征「難しい」で出やすくなれば下がる見込み(NoBS)\n- 魔石は長く使う装備(IL86 のダンジョン装備、製作装備)にだけ良い物を\n\n---\n\n## 8. 未確認・意見が割れていること\n| 点 | 内容 |\n|---|---|\n| 覚醒戦で死ぬと回数が減るか | 減る(Kanon・MR4KTV)/減らない(JPVariety) |\n| 聖域の時期と条件 | グローバル版は未実装。台湾版は IL2700 |\n| オードエネルギーの上限 | 560(メンバーシップ840)か一律840か |\n| デイリーダンジョンの回数 | 週14回が多数。「無料は週7回」の記述もある |\n\n## 9. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Soulgrot「AION 2の新パッチ」(i7DWoxD2nN4)、Aragon「新パッチ」(-jSOz3vGnS8) | 10/22 | 10/21 パッチ |\n| NoBS「シーズン1で来るもの」(ngtpCqSJGM0) | 10/18 | 今後の予想 |\n| Fubgun「戦闘力19万への道」(E4ESn8KWNgo) | 10/21 | 戦闘力の源 |\n| Moxsy「週5,000万ギーナの金策」(_sBsJSA9z9E) | 10/19 | サブキャラ |\n| Grobs「安価な強化術」(2vDVa75Y3XA)、Soulgrot「装備を正しく強化」(jI9i3ChAAQc) | 10/18〜19 | 強化と継承 |\n| Duky、Aragon、Soulgrot、Moxsy、Strylander、SywoGG、Leonis、BoredAF、MR4KTV、Kanon ほか | 10/7〜10/14 | 以前の出典(`_古い版/`) |\n| Metabot、mein-mmo、K1Persia ほか(日課・週課) | 10/5〜 | 回数の確度は `_古い版/AION2 日課週課まとめ.md` |\n| 펭귄몬스터、전하TV、동화의 게임 ほか(韓国版) | 10/5〜10/14 | 韓国版の今 |\n"},{"id":"arcana","tab":"アルカナ","title":"アルカナ まとめ","file":"アルカナのまとめ.md","md":"# アルカナ まとめ(2026-10-24 最新)\n\n「悪夢・覚醒戦・アルカナ・装備厳選・クラフト」の3章と「アルカナ_強化か抽出か」をまとめた。古い版は `_古い版/` にある。\nテンプラーで狙うスキルは `1_テンプラー/テンプラー_まとめ.md` の6章。\n\n## 0. 結論\n| 項目 | 結論 |\n|---|---|\n| 集め始める時期 | **IL2500(超越の4段階目)から本格的に**。4段階目は金が約60%で出る。3段階目(IL2200)は金が約12%なので、深追いしない(XifanGG・Fubgun・Leonis) |\n| 1枚目の金 | 覚醒戦4,000点などでためた神秘的な結晶5個で、**聖杯**を作る。一番大事なスキルを指定 |\n| いらないカード | 残すカードを **+2〜+3 まで強化**するのに使い、残りは**抽出**して結晶をためる |\n| +4・+5 | 「最後まで使うカード」だけ。1段に金カード12〜24枚分かかる |\n| 青・緑 | 大事なスキルが付いていれば、金より良いこともある。金に替えて大事なスキルの Lv16・20 が外れるなら替えない |\n\n---\n\n## 1. 仕組み\n| 項目 | 内容 |\n|---|---|\n| 効果 | カードを付けると、スキルのレベルと「神の能力値」が上がる |\n| 出る場所 | 超越ダンジョン(IL1600〜)。**砕けたアルカニス=羊皮紙・鏡、デウス研究基地=コンパス・鐘、両方=聖杯** |\n| 段階と出るカード | 1段階目は灰・緑、2段階目で青、3段階目(IL2200)で金が約12%、**4段階目(IL2500)で金が約60%** |\n| 付くスキル | 聖杯=どのスキルでも(だから狙ったスキルが付きにくい。1/18 など)。羊皮紙とコンパス=攻撃スキルを半分ずつ。鐘と鏡=パッシブを半分ずつ |\n| 確かめ方 | 「変換」タブ → カードを選ぶ → 追加効果、で自分のスキルがどのカードに付くか見られる |\n| セット | 活力(HP70%以上で PvE 攻撃 +60/4枚で +150)と魔力(MP 回復)。セットよりカードの神の能力値を優先してよい(Xia・XifanGG) |\n\n### レア度と強化\n| レア度 | 最初のスキル数 | 強化の上限 | IL |\n|---|---|---|---|\n| 灰 | 1 | +2 | 20 |\n| 緑 | 2 | +3 | 40 |\n| 青 | 3 | +4 | 60 |\n| 金 | 4 | +5 | 80 |\n\n- 1枚に付くスキルは最大4つ。4つ埋まった後は、強化するたびに**付いているスキルのどれか1つ**が+1。だから「4つとも良いスキルの金カード」を探す\n- 強化1段ごとに、神の能力値+1・IL+1(questlog.gg のデータ)\n- 強化は失敗しない\n\n### 神の能力値\n| 能力値 | 中身 |\n|---|---|\n| 時間 | 戦闘速度(評価が一番高い) |\n| 幻想 | 待ち時間短縮 |\n| 知恵 | 強打 |\n| 破壊 | 攻撃力増加 |\n| 死 / 自由 | クリティカル / 命中 |\n| 生命・運命・正義・空間 | PvE ではほぼ関係ない |\n\n---\n\n## 2. 強化に必要な経験値(金カード。metabot.gg のゲームデータ)\n| 段階 | 必要な経験値 | 金カード(+0)に換算 | 合計 |\n|---|---|---|---|\n| +0 → +1 | 3,000 | 1.5枚 | 1.5枚 |\n| +1 → +2 | 6,000 | 3枚 | 4.5枚 |\n| +2 → +3 | 12,000 | 6枚 | 10.5枚 |\n| +3 → +4 | 24,000 | 12枚 | 22.5枚 |\n| +4 → +5 | 48,000 | 24枚 | **46.5枚** |\n\n- 金カード(+0)を材料にすると 2,000。+4 まで上げたカードを材料にすると 47,000(注いだ分がほぼ戻る)。なので途中まで強化しても無駄になりにくい\n- 経験値用のカード(訓練のアルカナ)は最下級200〜最上級5,000。バトルパス・ショップ・出席報酬でもらえる。**強化にはまずこれ**\n- ほかのレア度の必要量: 灰 300/600、緑 600/1,200/2,400、青 1,200/2,400/4,800/9,600\n\n## 3. 神秘的な結晶\n| 項目 | 内容 |\n|---|---|\n| 使い道 | 金カードを作る(変換)。**スキル1つ指定で結晶5個+200万ギーナ**、2つ指定で結晶15個 |\n| 集め方 | ① 覚醒戦のスコア(シーズンミッション →「挑戦」→「シーズン」): 1,000点で1個、3,000点で1個、4,000点で1個、5,000点(エクストリーム)でもう1個 ② シーズンショップ(コイン25,000で1個。2個目以降は高いので1個だけにする人が多い) ③ いらないカードの抽出 |\n| 抽出の割合 | 1枚あたり 灰2%・緑4%・青6%(100%で1個)。**金は未確認**(notXeon の推測で8〜10%) |\n\n- 韓国版の항밍짱(10か月前): 聖杯は1つだけ指定すると残り3つがはずれになりやすく「結晶5個と200万を捨てるのと同じ」。**2つ指定して作る**のがよい\n- 金の聖杯は作ると7日間は次を作れない(韓国版。グローバル版は未確認)\n- 結晶の作り方の仕組みは、シーズンが変わると変わるかもしれない(metabot.gg)\n\n## 4. いらないカードは強化か抽出か\n| 手順 | やること |\n|---|---|\n| 1 | 良いスキルが2つ以上付いた金カードは**ロック**する |\n| 2 | 残すカードは、経験値用のカードといらないカードで **+2〜+3** まで上げる(金カード約10枚で届く) |\n| 3 | **+4・+5 は最後まで使うカードだけ**(1段に12〜24枚。結晶1〜2個分に当たる) |\n| 4 | 残りは抽出し、2つ指定した金の聖杯を作る分の結晶をためる |\n\n## 5. 進め方の例\n1. IL2000 で覚醒戦ハードを3分26秒以内にクリア(4,000点)→ 結晶3個。シーズンショップで1個、抽出で1個 → 金の聖杯\n2. IL2200〜2500 は、羊皮紙(作りやすい・付くスキルが少ない)で足りないスキルを埋める\n3. IL2500 から4段階目を回し、良い金カードを強化\n\n## 出典\n| 出典 | 中身 |\n|---|---|\n| metabot.gg「AION 2 Arcana Guide」 | 強化の経験値の表、材料の値、作る費用 |\n| XifanGG(約10/18)、Fubgun(10/21)、Leonis(10/21) | 集める時期、4段階目で金約60% |\n| notXeon、Kanon、Grobs、Society of Gaming(10/7〜10/16) | 仕組み、結晶の集め方、2つ指定で15個 |\n| 항밍짱、오지조(韓国版、10か月前) | 2つ指定して作る、強化は控えめに |\n| Antochi(10/21) | カードの出る場所 |\n"},{"id":"market","tab":"相場と製作","title":"相場と製作 まとめ","file":"相場と製作のまとめ.md","md":"# 相場と製作 まとめ(アリエル鯖・2026-10-24 最新)\n\n「市場の読み_アリエル鯖」「取引所の相場と買い時」「製作のおすすめと効率」「製作の最終段階までの素材」を1本にし、10/24 夜(19時)の相場で計算し直した。古い版は `_古い版/` にある。\n- 相場: 相場ボード https://tamanegin.github.io/aion2-market/ のデータ(Aion2Market の最安出品価格、10/24 19:09。他鯖は 14:51)。毎日の判断はボードを見る\n- 「対アジア」= アジアの他6鯖の中央値と比べた差。名前は questlog.gg の日本語版の正式名\n\n## 0. 今の判断\n| 区分 | 品物 | 判断 |\n|---|---|---|\n| **買うのは待つ** | 怒りの思念・意志・自我 | 10/21 から遠征「難しい」で出るようになった(思念66%、意志・自我16%)。アリエルは他鯖より**30〜70%高い**。ボードの予想も3つとも「下がる」 |\n| **持っていれば分けて売る** | 煌めく素材(オリハルコン鉱石・オード・原石・ユグドラシルの木) | 10/12 から約8〜9倍。先行鯖ではまだ上がっているので数日は上がりそう。ただしアリエルは他鯖より15〜70%高い |\n| 下がっている | 精錬石、達人の最上級精錬石、純粋な素材の多く、龍族の角・鱗 | 使う直前に買う |\n| **作るより買う** | 金の材料(達人の光る〇〇) | ロングソード・ガーダー・リング・イヤリングは買うほうが安い。ネックレスはほぼ同じ。アリエルは他鯖より20〜33%安い |\n| 作るほうが安い | 真龍王のリング(IL62) | 作ると約1,960万、取引所 2,100万。さらに25%で光る真龍王のリング(取引所 3,300万)になる |\n| 作るしかない | 真龍王のネックレス(IL62)、IL70 以上の全部 | 出品がない、または継承製作の物は売れない |\n\n---\n\n## 1. 品目ごとの今(10/24 19時)\n\n### 怒りの素材(製作の上の段で使う)\n| 品物 | 今 | 3日 | 7日 | 対アジア | 出品 |\n|---|---|---|---|---|---|\n| 怒りの思念 | 198万 | +2% | −6% | **+68%** | 121 |\n| 怒りの意志 | 60万 | −3% | +37% | **+69%** | 71 |\n| 怒りの自我 | 220万 | +22% | −6% | +32% | 32 |\n- 10/14 は 思念210万・意志22万・自我210万。意志だけ大きく上がった\n- 先行鯖(シエルなど)では3日で 意志 −13%・自我 −28%。下がり始めている\n\n### 煌めく・純粋な採集素材\n| 品物 | 今 | 3日 | 対アジア | 先行鯖の3日 |\n|---|---|---|---|---|\n| 煌めくオリハルコン鉱石 | 87万 | +41% | +25% | +112% |\n| 煌めくオード | 80万 | +14% | +4% | +62% |\n| 煌めくサファイアの原石 | 82万 | +29% | +15% | +47% |\n| 煌めくルビーの原石 | 78万 | +11% | +23% | +100% |\n| 煌めくダイヤモンドの原石 | 85万 | +47% | **+70%** | +87% |\n| 煌めくユグドラシルの木 | 89万 | +39% | +21% | +90% |\n| 純粋なオリハルコン鉱石 / オード | 14万 / 13.5万 | −7% / −4% | −7% / −11% | 上昇 |\n| 純粋な原石(サファイア/ルビー/ダイヤ) | 20万 / 12万 / 15.5万 | まちまち | | |\n\n- 10/12 の煌めくオリハルコン鉱石は約10万。10/14 のパッチ(オードエネルギーの週の上限変更、採集素材の出品制限)から急騰した\n- 上がっているのは「煌めく」だけ。普通・高純度の素材は7日で −30〜−50%\n- 下がるきっかけになりそうな物: ハロウィンイベント(韓国版ではオードエネルギーを選べる)、出品制限の緩和(10/21)\n\n### 精錬石・龍族の素材\n| 品物 | 今 | 3日 | 対アジア |\n|---|---|---|---|\n| 精錬石 | 700 | −50% | −51% |\n| 職人の精錬石 | 8万 | +4% | −13% |\n| 達人の精錬石 | 32万 | +7% | +7% |\n| 達人の最上級精錬石 | 16万 | −29% | +14% |\n| 龍族の精髄 | 3.5万 | +1% | **+138%** |\n| 精錬された 分厚い/硬い/堅固な 龍族の角 | 3.8万 / 6万 / 7.5万 | −28% / −33% / +5% | |\n| 強化された 分厚い/硬い/堅固な 龍族の鱗 | 3.9万 / 8.3万 / 8.6万 | −59% / −25% / −14% | |\n\n### 製作の装備(取引所)\n| 品物 | 今 | 出品 | 対アジア |\n|---|---|---|---|\n| 達人の光るオリハルコンのロングソード | 1,550万 | 15 | −33% |\n| 達人の光るオリハルコンのガーダー | 1,690万 | 12 | −28% |\n| 達人の光るサファイアのリング | 700万 | 21 | −22% |\n| 達人の光るルビーのネックレス | 1,400万 | 8 | −20% |\n| 達人の光るダイヤモンドのイヤリング | 1,100万 | 8 | −27% |\n| 真龍王のリング / 光る真龍王のリング | 2,100万 / 3,300万 | 4 / 3 | |\n| 真龍王のイヤリング / 光る | 3,700万 / 4,450万 | 4 / 2 | |\n| 真龍王のロングソード / ガーダー | 7,200万 / 6,500万 | 1 / 1 | 出品1件の値段なのであてにならない |\n\n---\n\n## 2. 作るか買うか(金の材料。相場ボードの計算)\n| 品物 | 作る(一番安い作り方) | 取引所 | 判断 |\n|---|---|---|---|\n| 達人の光るロングソード | 1,888万(職人の光るロングソードを買って作る) | 1,550万 | **買う** |\n| 達人の光るガーダー | 1,967万(職人の光るガーダーを買って作る) | 1,690万 | **買う** |\n| 達人の光るリング | 823万(光るリングを買って作る) | 700万 | **買う** |\n| 達人の光るネックレス | 1,465万(全部作る) | 1,400万 | ほぼ同じ |\n| 達人の光るイヤリング | 1,199万(全部作る) | 1,100万 | 買う |\n- 光る装備は25%なので「各段階を4回作って光る物を1つ作り、次の段階へ」で計算。成功率(約94%)と外れの売値は入れていない\n\n---\n\n## 3. ロングソード・ガーダーを IL102 まで作る\n\n### 3-1. 段階\n| 段階 | IL | 天族の名前 | 作り方 |\n|---|---|---|---|\n| ① 金の材料 | 44 | 達人の光るオリハルコンのロングソード | 通常製作(白→緑→青→金、各25%で光る) |\n| ② | 62 | 真龍王 | 通常製作(**失敗あり**)。25%で③に直接 |\n| ③ | 70 | 光る真龍王 | 継承製作(必ず成功) |\n| ④ | 78 | 白龍王 | 継承製作。①がもう1本要る。25%で⑤に直接 |\n| ⑤ | 86 | 光る白龍王 | 継承製作 |\n| ⑥ | 94 | 冥龍王 | 継承製作。①がもう1本要る。25%で⑦に直接 |\n| ⑦ | 102 | 光る冥龍王 | 継承製作 |\n- 継承製作の物は拘束されて売れない。強化値と刻印は引き継がれる(賢者の石の枠と魔石は消える)\n- ロングソードとガーダーは素材も個数も同じ(AION2 Hub)\n\n### 3-2. 素材と費用(1本分。10/24 のアリエルの値段で計算)\n| 段階 | 素材 | 費用 |\n|---|---|---|\n| ② IL62 | ①、達人の最上級精錬石4、精錬された分厚い龍族の角22、**怒りの思念10**、煌めくオリハルコン鉱石9、煌めくオード5 | 約4,860万(10/14 は約2,670万) |\n| ③ IL70 に上げる | 分厚い角11、怒りの思念4 | 約830万 |\n| ④ IL78 | ①、精錬石5、硬い角29、思念3、**怒りの意志15**、鉱石12、オード7 | 約4,900万 |\n| ⑤ IL86 に上げる | 硬い角15、意志5、鉱石1、オード2 | 約640万 |\n| ⑥ IL94 | ①、精錬石6、堅固な角41、思念3、意志3、**怒りの自我20**、鉱石15、オード9 | **約9,130万**(うち自我が 4,400万) |\n| ⑦ IL102 に上げる | 精錬石2、堅固な角21、自我7、鉱石2、オード3 | 約2,130万 |\n| **合計** | | **コンボなし 約2.25億 / 全部コンボ 約1.9億**(10/14 は 2.1億 / 1.7億) |\n\n- ①は取引所の 1,550万で計算。ガーダーは①が 1,690万なので、1段ごとに約140万高い\n- 角は 精髄2個+ハンマー(NPC)でも作れる(堅固な角なら約7万)\n- **⑤(光る白龍王 IL86)から次の⑥へは約9,130万**。⑥で光らなければ⑦にさらに約2,130万\n- 費用の中心は怒りの自我(20〜27個)と煌めく素材。どちらも今は高いので、**⑥は急がず、怒りの素材と煌めく素材が下がってから**が安い\n- 参考: Soulgrot のサーバーでは IL86 のロングソードが合計 6,000万〜7,000万、リングは 3,000万〜4,000万(10/18)\n\n### 3-3. リング・ネックレス(IL62 の真龍王)\n| 品物 | 素材(①以外) | 作る | 取引所 | 判断 |\n|---|---|---|---|---|\n| リング | 達人の最上級精錬石2、強化された分厚い龍族の鱗8、**怒りの思念4**、煌めくサファイアの原石3、煌めくオード2 | 約1,960万 | 2,100万 | **作るほうが少し安い**。25%で光る(3,300万相当) |\n| ネックレス | 精錬石3、分厚い鱗14、**怒りの思念6**、煌めくルビーの原石6、煌めくオード2 | 約3,320万 | 出品なし | 作るしかない |\n- どちらも費用の半分以上が怒りの思念。思念が下がるのを待つと安くなる\n\n---\n\n## 4. 何を作るか・作り方のコツ\n| 項目 | 内容 |\n|---|---|\n| 作る順 | **ロングソード → ガーダー → リング**(Soulgrot・JOHNPAL)。ロングソードは刻印5行で戦闘速度が付き、一番強い。防具はダンジョン装備で十分 |\n| 安く済ませる | 細工(リング)が一番安い |\n| 成功率 | 熟練度で上がり、約94.6% で止まる。**高い製作は熟練度50まで上げてから**。熟練度は一番安い物(オリハルコンのインゴットなど)で上げる。「10個まとめて作る」は経験値が少ない |\n| 絞る | 製作は1種類に絞る。テンプラーのロングソードとガーダーは鍛冶 |\n| 素材 | オードは物質変換でほかの採集素材に替えられる(ただし変換した物は拘束されて売れない) |\n| 失敗作 | 捨てずに補給依頼へ(アビスポイントと強化石) |\n| 上位素材 | 怒りの素材は遠征で出る。グローバル版は拘束なしなので、サブキャラで集めてメインへ |\n\n---\n\n## 5. 売り買いのコツ\n| コツ | 内容 |\n|---|---|\n| 小分けに売る | 高い物は小分けに、少し高めで待つ。出品が急に増えた物は値下げ競争になりやすい |\n| まとめ買い・1個売り | まとめ売りを買って1個ずつ出すと高く売れる(急ぐ人は1個で買う) |\n| 合計金額の並び | 一覧は合計金額順。大量に買う人は1個の値段を見ていないことがある |\n| 手数料 | 売れたら10%。出品の登録手数料は付け直すと戻らない |\n| 時間帯 | アリエルでは「朝は安い・夕方に売れる」ははっきりしなかった(10/14 に検証) |\n| 出品枠 | 10個まで |\n\n### 取引所の仕組み\n- 取引所とギーナ・キューナの交換所は**メンバーシップ会員だけ**\n- ギーナ → キューナ: 物質変換で「ギーナの箱」(10%余計にかかる)を作り、交換所に出す\n- 現金で買ったキューナは72時間たつまで交換所で使えない\n- 拘束のギーナは取引所で使えない(登録手数料には使える)\n- 取引所はサーバーごと。ほかのサーバーからは買えない\n\n### 先行鯖(シエル・ネザカン・バイゼル)との関係(10/14 に検証)\n- 全部の品物が数日遅れで同じ動きをするわけではない。パッチで動く物は全サーバーが同じ日に動く\n- 「進むほど欲しくなる素材」(怒りの自我・意志)は、先行鯖が数日先に動く傾向。相場ボードの「数日の予想」はこれを使っている\n\n---\n\n## 6. 注意\n- 最安出品価格なので、実際に売れた値段とは違うことがある。アリエル鯖は売れた数のデータがない\n- 出品が数件しかない品物は、1人が出すだけで大きく動く\n- パッチで価値が急に変わることがある(韓国版で何度も起きた)\n- 相場ボードの「予想の当たり外れ」は、10/24 時点でまだ判定できた件数が0件\n- IL62 のリング・ネックレスのレシピは 10/14 に AION2 Hub で見た物。ロングソードのレシピは 10/14 にグローバル版のデータで確かめ直した\n\n## 7. 出典\n| 出典 | 中身 |\n|---|---|\n| 相場ボード(Aion2Market のデータ) | 10/24 19:09 の値段、3日・7日の変化、他鯖との差、作るか買うか |\n| AION2 Hub https://aion2hub.com/tools/crafting-calculator | 製作のレシピ |\n| Soulgrot(10/18)、JOHNPAL(10/17)、Moxsy(10/19) | 作る順、費用の目安、サブキャラ |\n| Aragon・Soulgrot(10/22) | 10/21 パッチの報酬 |\n| 以前の出典(Screamheart、Sen Evades、GAC Film Room、StingKnight、MrRosaPony、Nellan97、Duxar ほか) | `_古い版/` の各まとめ |\n"},{"id":"pet","tab":"ペット","title":"魔族側にしかいないペットと狩場","file":"魔族側にしかいないペットと狩場_2026-10-23.md","md":"# 魔族側にしかいないペットと、回るルート(天族向け・2026-10-23)\n\n## 0. 結論\n- 全200種のうち、天族側の地域に出ないペットは44種(questlog.gg のデータを全部集計)。**そのうちアビスで狩れる物を除くと、アルトガルド(魔族側)でしか集められないのは33種**\n- ペットの魂は取引できない(交換不可・売却不可)。自分で倒して集めるしかない\n- 天族がアルトガルドへ行けるのは**時空の亀裂**だけ。開くのは日本時間の 2・5・8・11・14・17・20・23時で、入口は最初の10分だけ、中にいられるのは1時間\n- 回る順番は Th3Ruthless さんの地図「ALTGARD / MAINLAND ROUTE」の番号①〜⑪に合わせた。下の表がその番号ごとの狩る相手\n\n## 出典\n| 種類 | 出典 |\n|---|---|\n| ペットごとの、魂を落とすモンスターと地域 | questlog.gg のデータベース(魂を落とす NPC と、その NPC がいる地域) |\n| 番号付きのルート、各場所のモンスター | Th3Ruthless「AION 2 ペット集め完全攻略ガイド」(10/14)と、その人が作ったサイト https://t3r-aion2-petfarming.netlify.app/ (天族用の7ページ目が地図、8ページ目がモンスター表) |\n| 地名・モンスター名 | questlog.gg の日本語版データ(英語版と突き合わせた) |\n\n## 1. 番号ごとの狩る相手(アルトガルド)\n「出現数」は questlog.gg に載っている湧き場所の数(アルトガルド全体の合計)。少ない物ほど集めにくい。\n\n### ① ドレドギオン墜落地(Lv10〜12)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| アルマドン | 野性 | 赤い殻モグラ | 149 |\n| 死肉虫 | 野性 | ドラナ死肉虫 | 16 |\n| ドラカナ カルクゲルム | 変身 | 墜落地のカルクゲルム | 13 |\n| ドラナ変異体 | 変身 | 歪んだ変異体 | 50 |\n| ドラナ スライム | 変身 | ドラナ スライム | 21 |\n\n### ② 名もなき墓地(Lv13〜17)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| ビロータ薬草採り | 知性 | ビロータ薬草採り | **4(とても少ない)** |\n| 枯れ枝蜘蛛 | 野性 | 枯れ枝蜘蛛 | 306 |\n\n### ③ 静寂の丘(Lv18)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| トーグ | 野性 | トーグ | 10 |\n\n### ④ モスランの森(Lv21〜22)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| バジリスク | 野性 | 黒灰バジリスク | 16 |\n| 変異したウルサス | 野性 | 灰色のウルサス | 18 |\n| 灰色のディオナエ | 自然 | 灰色のディオナエ | 14 |\n| 変異した森の守護者 | 自然 | 変異した森の守護者 | 43 |\n\n### ⑤ ウルタムハイム(Lv24)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| 手懐けたカルニフ | 野性 | ブレイド団のカルニフ | 64 |\n| 死体掃除屋 | 変身 | 遺跡の死体掃除屋 | 78 |\n\n### ⑥ 浄化の森(Lv29〜30)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| 歪んだ変異体 | 変身 | 侵食された精霊の守護者 | 20 |\n| 毒血 | 変身 | 呪われた毒血 | 53 |\n| スライム | 変身 | 乱暴なスライム | 10 |\n\n### ⑦ ドラナクタス・激戦の丘(Lv32)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| ムームー族戦士 | 知性 | ムームー族の番人 | 153 |\n| ムームー族作業員 | 知性 | ムームー族作業員 | 116 |\n| 監視のオキュラゼン | 変身 | 監視のオキュラゼン | 19 |\n\n### ⑧ バスフェルト廃墟(Lv33)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| 魂のない屍ヤブカ | 変身 | 魂のない屍ヤブカ | 22 |\n\n### ⑨ ファフナイト埋蔵地(Lv35〜36)— 一番多くそろう場所\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| 中毒になったシュラク担夫 | 知性 | 暴走したシュラク担夫 | 29 |\n| 色あせた浮遊体 | 変身 | 色あせた浮遊体 | 20 |\n| 色あせた捕食者 | 変身 | 色あせた捕食者 | 15 |\n| バイオラント | 変身 | 中毒になったバイオラント | 37 |\n| 寄生スウォーム | 変身 | 巨大鉱石虫の成虫 | 11 |\n\n### ⑩ グリバデ丘陵地(Lv40)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| リュクロック | 野性 | 捜索隊リュクロック、警備隊リュクロック | 90 |\n\n### ⑪ 黒爪族の集落(Lv41〜42)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| ドゥドゥカ作業員 | 変身 | ドゥドゥカ作業員 | 75 |\n| ドゥドゥカ投石兵 | 変身 | ドゥドゥカ投石兵 | 44 |\n\n### ルートの外(地図の右上の「精霊の島」。必要なら)\n| ペット | 種族 | 倒すモンスター | 出現数 |\n|---|---|---|---|\n| オードの石の精霊 | 自然 | 色あせたオード精霊(Lv46) | 10 |\n| 灰色のアグリント | 自然 | 不安定なアグリント(Lv48) | 8 |\n\n## 2. 外したペット\n| 理由 | ペット |\n|---|---|\n| アビスでも狩れる | スウォーム、ニュート偵察兵、バーグ狂戦士、永遠のコラドン、色あせた変異体、色あせた変異体の巨漢(Th3Ruthless の地図では⑥⑦⑨⑩に入っている)。アビスだけにいる5種(ナーガラント守護戦士、ナーガ精鋭司祭、蜘蛛、銀色の刃ロータン、精霊王の護衛戦士)も外した |\n| 普通の狩りでは集められない | 精鋭カルニフ、精鋭ドゥラトナ(どちらもモルヘイムの Lv80 ネームドのボスが落とす) |\n| 日本語名を確かめられなかった | Th3Ruthless の地図にある「Congealed Drana」(①)と「Faded Drana」(⑨)。questlog.gg に同じ名前のペットがなく、どれに当たるか分からなかった |\n\n## 3. 集め方のコツ\n| コツ | 内容 |\n|---|---|\n| 必要な数 | 入手に魂5個、Lv2 まで25個、Lv3 まで75個。落ちる確率は100%ではないので、Lv3 まで1種あたり100体以上倒すつもりで(Soulgrot) |\n| 1時間の使い方 | 1回の亀裂で全部は回れない。終わった場所は飛ばす。混んでいたら次の番号へ進み、あとで戻る(Th3Ruthless) |\n| 危険 | 魔族の地域なので、魔族プレイヤーに襲われる。相手側の人が少ない時間に行くほうが狩りやすい |\n| ついでに | 狩りの途中で、天族側にもいるペットの魂が出たら、そこで一緒に集めてしまう |\n| 隠しキューブ | 効果音だけ上げて BGM・環境音を消すと、鈴のような音が遠くから聞こえる。1個で結晶約1,000個 |\n| 進行の記録 | Th3Ruthless のサイトは、集めた物にチェックを付けて保存できる(天族用のページ) |\n\n## 4. 確かめていないこと\n- 時空の亀裂の出口の場所と、アルトガルドのどこへでも自由に行けるのか(Th3Ruthless の動画では自由に回っているように見えた)\n- 出現数は湧き場所の数で、湧く速さではない\n"},{"id":"classes","tab":"ほかの職業","title":"レンジャー・チャンター・クレリックのビルド","file":"レンジャー・チャンター・クレリックのビルド_2026-10-23.md","md":"# レンジャー・チャンター・クレリックのビルド(PvE・2026-10-23)\n\n海外の人気動画(グローバル版)8本と、説明欄に載っていた資料をまとめた。スキル名と特化の文は、questlog.gg の日本語版データで確かめた正式名で書いている。\n\n## 0. 読み方\n- **特化**は、スキルのレベルで選べる数が増える。Lv8で1つ、Lv12で2つ、Lv16で2つ(入れ替えができる)、Lv20で3つ。表の「Lv12:3+4」は「3番と4番を付ける」という意味\n- 番号は特化の並び順(1〜5)。番号のあとに効果を短く書いた\n- **マクロ**は3職業とも同じ考え方。左クリックで基本攻撃を押し続け、右クリックに割り当てたマクロも押し続ける。マクロは「段」の上から順に使えるスキルを探して出す(設定 → キー設定 → 一般 → マクロ を右クリックに)\n- 「強打」= Double Chance(ダメージが2倍になる確率)。questlog.gg の英日データで確認した(`用語対応表.md` の「二重攻撃」は誤り)\n\n## 出典\n| 職業 | 動画(投稿日) | 投稿者 | 中身 |\n|---|---|---|---|\n| レンジャー | 【Aion 2】レンジャー究極攻略ガイド(10/17、32分) | JOHNPAL TV | 説明欄の Google ドキュメントに、特化の番号・マクロ・刻印の優先順(10/17 更新) |\n| レンジャー | 最強レンジャー完全ガイド(10/5) | Moxsy | JOHNPAL の監修。上げ方の順番 |\n| チャンター | 世界ランク1位のチャンターが教えるビルド(10/20) | gigawhale(グローバル1位) | 終盤の DPS ビルド |\n| チャンター | The ONLY 2500+ Chanter Guide(10/18) | notXeon | IL2500 以降、Lv20 の選び方、アルカナ |\n| チャンター | チャンターの PvE 完全攻略ガイド(10/5) | Grobs | 序盤〜中盤、マクロの仕組み |\n| クレリック | Rank 1 Ultimate Cleric Guide(10/18) | Krix Domi(NotMeter の DPS 1位) | 特化・マクロ・アルカナ |\n| クレリック | 新版クレリック・エンドゲームガイド(10/20) | TheWhelps | 大地の懲罰 Lv20 後のマクロの変え方 |\n| クレリック | 世界ランク1位が教えるクレリックガイド(10/4) | Lucia | 序盤の上げ方、PvP |\n\n---\n\n## 1. レンジャー\n\n### 1-1. 役割\n- 狩りがとても強い(マクロを押して回るだけで周りが倒れる)。DPS も今は上位\n- 立ち上がりは遅い。**スティグマ「バイゼルの権能」を Lv20 にすると強くなる**(クリティカル時に50%の確率で、すべての再使用時間が1秒減る)\n- 体は弱い。多くのスキルは4mの範囲しか巻き込まないので、敵を集めてから撃つ(爆発の罠の1番「爆発時に敵を引き寄せる」が便利)\n\n### 1-2. スキルの上げ方と特化(JOHNPAL の資料、10/17)\n上げる順番は「優先度」の列のとおり。\n\n| スキル | 優先度 | Lv8 | Lv12 | Lv16 | Lv20 |\n|---|---|---|---|---|---|\n| 狙撃(左クリック) | 最優先 | 3 多段ヒット+50% | 3+4(4=必中の矢の再使用 −1秒) | 4+5(5=連続スキル[疾風の矢]追加) | 3+4+5 |\n| 速射(MP を使う主力) | 最優先 | 3 対象が少ないほど+12% | 2+3(2=クリティカル+10%) | 3+5(クリティカルが50%を超えたら。超えなければ 2+5) | 2+3+5 |\n| 狂風の矢 | 最優先 | 1 持続+5秒 | 1+4(4=対象が少ないほど戦闘速度など増加) | 4+5(5=再使用 −10秒) | 3+4+5 |\n| 必中の矢(溜めの大技) | 最優先 | 2 スキル速度+30%(動きたいなら3) | 2+3 | 2+5 | 2+4+5(動きたいなら 2+3+5) |\n| 鋭穿の矢 | 高 | 3 スキル速度+20% | 3+4(4=必ず多段ヒット) | 3+5(5=1回追加発動) | 3+4+5 |\n| 破裂の矢 | 高 | 2 多段ヒット+50% | 3+4 | − | − |\n| 標的の矢(開幕の強化) | 高 | 3 持続+5秒 | 1+3(1=完璧+5%) | − | − |\n| 捕縛の矢 | 中 | 2 スキル速度+20%(動きたいなら3) | 2+3 | − | − |\n| 爆発の罠 | 中 | 3 3秒後に追加ダメージ | 1+3(1=敵を引き寄せる) | − | − |\n| 制圧の矢 | 中 | 1 多段ヒット+50% | 1+3 | − | − |\n| 矢乱射 | 使わない | − | − | − | − |\n\n- 矢乱射は、ボスがグロッキー(気絶して動けない状態)のときだけ使えるが、押すと DPS が下がる(JOHNPAL、Moxsy とも)\n- Moxsy(10/5)は、狙撃を Lv8 で「1 MP回復+20%」にし、Lv12 で「4 必中の矢の再使用 −1秒」を足している。MP が足りないならこちら\n- **必中の矢を早く上げる**(スキル速度と移動可能が付いて大きく伸びる。Moxsy)\n\n### 1-3. パッシブの優先順\n集中の眼 = ハンターの決意 = ハンターの魂(最優先)\u003e 集中砲火 \u003e 近接射撃・束縛の眼 \u003e 警戒の目・風の活力 \u003e 蘇生の契約・抵抗の決意\n\n### 1-4. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| バイゼルの権能 | **20(最優先)** | 20でクリティカル時に再使用時間が減る。これが本番 |\n| 支援射撃 | 10〜20 | 追加の射撃と HP1.5%回復。最初の1枠はこれ(JOHNPAL) |\n| 祝福のボウ | 15〜20 | 20で強打+7% |\n| グリフォンの矢 / 爆発の矢 | 15 / 5 | 序盤は爆発の矢を Lv5(再使用 −15秒)。グリフォンの矢は15から使う |\n\nポイントの配り方(資料の目安。列はバイゼル / 支援 / ボウ / グリフォン)\n| スティグマのポイント | 配り方 |\n|---|---|\n| 100 | 20 / 10 / 10 |\n| 120 | 20 / 5 / 5 / 15 |\n| 160 | 20 / 10 / 15 / 15 |\n| 220 | 20 / 20 / 15 / 15 |\n| 300 | 全部20 |\n\n- Moxsy の方法: Lv45 までは全部を5に揃える → ポイントが貯まったら振り直し(無料)てバイゼルを20に\n- スティグマのかけらは、悪夢のショップ(左のボスを10段まで)とアビスで集める。アビスの「タイル」は PvP 専用なので買わない(JOHNPAL)\n\n### 1-5. おすすめマクロ\n**右クリックのマクロ(JOHNPAL 10/15 版。4段から3段に減らして DPS が上がった)**\n| 段 | 中身(上から順に試す) |\n|---|---|\n| 1 | 狂風の矢 → グリフォンの矢 → 捕縛の矢 → 破裂の矢 |\n| 2 | 鋭穿の矢 |\n| 3 | 鋭穿の矢(2回入れるのは、速射を撃つ回数を増やすため。検証で速射が413回 → 465回に) |\n| 空いたとき | 速射(MP の捨て先) |\n\n- 手軽にするなら、バイゼルの権能・祝福のボウ・支援射撃もマクロに入れる(Moxsy は破裂の矢の段に入れている)。最大火力を狙うなら、この3つは手で使い、ボスが戻ってくる時に合わせる\n- **必中の矢と標的の矢は手で押す**。必中の矢はマクロに入れると1段目の溜めしか撃たない。押し続けて最大まで溜める\n- 標的の矢は持続が再使用より長い。効果が残り1秒ほどになってから掛け直す(早く掛け直すと損)\n- 動き: 左クリック(狙撃)と右クリック(マクロ)を押し続ける → 開幕に標的の矢 → 強化 → 必中の矢を溜めて撃つ → 再使用が戻るたびに必中の矢\n- 設定: ターゲット「カメラ前方優先」、「スキル使用時に自動ターゲット」をオン(押しっぱなしで次の敵へ)\n\n### 1-6. 刻印・その他(JOHNPAL の資料)\n| 部位 | 優先順(左ほど大事) |\n|---|---|\n| 武器・ガーダー | 武器ダメージ増幅、戦闘速度、威力、正確、ダメージ増幅、多段ヒット |\n| ネックレス・イヤリング | 集中の眼、ハンターの決意、(戦闘速度)、威力、正確 |\n| リング | 必中の矢、速射、狂風の矢、鋭穿の矢(スキルのレベル) |\n| グローブ | 戦闘速度 |\n| マント | 強打 |\n| 防具のほか | 集中の眼、ハンターの決意 を各部位に |\n\n- クリティカルは上限50%にすぐ届く。命中は 1,000〜1,200(祝福のボウの+300込み)が目安。魔石は命中をクリティカルより優先\n- アルカナ: 活力2つ(聖杯・羊皮紙)+魔力3つ(コンパス・鐘・鏡)。上げたいスキルは 必中の矢、狂風の矢、速射、鋭穿の矢、集中の眼、ハンターの決意。目標は「上位4つを16、その次に20」\n- 神の能力値: 知恵(強打)\u003e 破壊 \u003e 時間 \u003e 死 \u003e 幻想\n- 羽: Forest Spirit Wings(日本語名は未確認)が値段の割に一番\n\n---\n\n## 2. チャンター\n\n### 2-1. 役割\n- 分類は支援だが、今の調整では火力がとても高い。早い段階から強く、伸び方がまっすぐ(gigawhale)。装備が揃った先では他の職業に抜かれる見込み\n- 主力の岩撃砕と回転撃は確定クリティカルになるので、装備で**クリティカルを集めなくてよい**。攻撃力・威力・武器ダメージ増幅を積む\n- 終盤のダメージの約4割は 岩撃砕 と、その連続スキル 貫通砕\n\n### 2-2. スキルの上げ方と特化\n**Lv16 の順番: 岩撃砕 → 撃破砕 → 回転撃・百裂撃。Lv20 の順番: 岩撃砕 → 撃破砕 = 回転撃**(3人とも同じ。PvP なら 岩撃砕 → 快癒の呪文 → 回転撃)\n\n| スキル | 序盤(Lv8〜12) | Lv16 | Lv20 |\n|---|---|---|---|\n| 岩撃砕(主力) | 3 確定クリティカル、4 連続スキル[貫通砕]追加 | +5 再使用時間削除(**最重要**。これで連打できる) | 3+4+5 |\n| 撃破砕(左クリック。MP が増える) | 2 HP吸収、3 多段ヒット+50% | 3+5(5=4番連続スキル[暴風砕]追加)。**4 回転撃の再使用 −1秒 は必ず入れる**(20 になるまでは 4+5) | 3+4+5 |\n| 回転撃 | 1 再使用 −5秒、3 対象が少ないほど+20% | 1+5(5=確定クリティカル) | 1+3+5 |\n| 百裂撃(右クリックの基本) | 3 対象が少ないほど+12% | 3+5(5=ガードと回避を無視) | − |\n| 打撃砕 | Lv8 で 3 移動可能に | 3+4(4=スキル速度+30%) | − |\n| 突進撃破(移動) | Lv12 で 4 敵を倒すと再使用初期化 | − | − |\n| 震動砕(移動。回避のあとに使える) | Lv8 で 2 射程+10m(突進撃破と同じ射程に) | 2+3 | − |\n| 快癒の呪文(回復) | 1 連続+1回と持続回復、Lv12 で +4 HP5% | 1+5(5=再使用 −3秒) | PvP は 2 デバフ解除 |\n| 疾風乱舞 | ボスのグロッキー中だけ使える。Lv16 でないと意味がない | 終盤は使わないほうが火力が出る(gigawhale) | − |\n| 波動撃・裂波撃 | PvE では使わない | − | − |\n\n### 2-3. パッシブ\n**風の約束 \u003e 攻撃準備 \u003e 衝撃的中** の3つだけ上げる(3人とも同じ)。風の約束でクリティカル ダメージが十分あるので、魔石やペットでクリティカル ダメージを取らなくてよい(gigawhale)\n\n### 2-4. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| 不敗のマントラ | **20(最優先)** | パーティー全体の PvE ダメージ増幅・耐性。20で強打+5% |\n| 疾風の権能 | 5 → 20 | 5で再使用 −30秒。6〜15はほぼ差がない。20で自分の攻撃力+20%、仲間+10% |\n| マルクタンの怒り | 5〜10 | 岩撃砕を使えるようにする(連打のため) |\n| 守護の祝福 | **15**(15未満なら入れない) | 15で風の約束の効果が1.5倍。2分持続 |\n| 疾走のマントラ | 序盤・速さ重視 | 移動速度(パーティーが攻撃を避けやすい)。序盤はこれ |\n\n- 入れ替え: グロッキーが要るボス → 滅火、ガードが効くボス(ルドラなど)→ 集中防御、パーティーを守る → 遮断の権能、回復 → 快癒の手(15でデバフ5個解除)\n- 不敗のマントラと疾風の権能は、クレリックの一部のスキルと**効果が重ならない**(Grobs)\n- 序盤は粉砕撃(防御を下げる)も強い。防御は固定値で減らすので、敵の防御が低い序盤ほど効く(Grobs)\n\n### 2-5. おすすめマクロ\n**右クリックのマクロ(Grobs・gigawhale・notXeon で同じ形)**\n| 段 | 中身(上から順に試す) |\n|---|---|\n| 1(岩撃砕の段) | 岩撃砕 → 回転撃 → マルクタンの怒り → 打撃砕 |\n| 2 | 百裂撃 |\n| 別(任意) | 守護の祝福(持続と再使用がどちらも2分なのでマクロに入れてよい) |\n\n- 仕組み: 岩撃砕は、回転撃・マルクタンの怒り・打撃砕を使った直後の数秒だけ使える。**4つを同じ段に入れる**と、引き金のスキル → 岩撃砕 → 次の引き金 … と自動で回る。全部が再使用中なら百裂撃へ\n- 左クリック(撃破砕)と右クリック(マクロ)を押し続ける\n- 開幕: 疾風の権能でパーティーを強化 →(マルクタンの怒り)→ 突進撃破で飛び込む → 押し続ける。減った人がいたら快癒の呪文\n- notXeon はマルクタンの怒りをマクロから外し、岩撃砕が止まった時に手で押す\n- 最大火力を狙う人形(ダミー)の計測では、守護の祝福をマクロに入れると回り方が崩れて5〜10%下がることがある(gigawhale)。普段の周回では入れてよい\n\n### 2-6. 刻印・アルカナ・その他\n- 刻印: 序盤は攻撃力・威力だけ。中盤から戦闘速度・武器ダメージ増幅・多段ヒット\n- リング: 岩撃砕・回転撃・撃破砕(スキルのレベル)\n- アルカナ: 羊皮紙は「生命」(HP と再生)で 岩撃砕・撃破砕・回転撃・突進撃破 が付く物、聖杯は「時間」(戦闘速度)、鐘は「破壊」(攻撃力)、鏡は「知恵」(強打。PvP なら幻想)。パッシブは 風の約束 → 衝撃的中、鐘は 攻撃準備 → 生命の祝福(notXeon)\n- 目標: スキルを20にするのは、アルカナ(金のカード。IL2500から)+リング。20を超えた分は無駄なので、カードとリングで振り分ける\n- ペット: 4番の枠はクリティカル ダメージ増幅か ダメージ増幅、ほかは攻撃力。特殊ペットの4番は強打。攻撃力が付かない枠はパワーシャードのダメージ\n- 武器: 火の神殿の武器は射程+2m で便利、製作武器は刻印が5行で最終的に強い(notXeon)\n- 料理・巻物: 速度・勇気の巻物、パワーシャードは周回でも使う。高い料理は大事な時だけ(gigawhale)\n\n---\n\n## 3. クレリック\n\n### 3-1. 役割\n- 回復役。ただし DPS も出せる。ダンジョンの貢献度5%以上を目安にする(Krix)\n- ダメージの約5割は **断罪**。苦痛の連鎖を付けた敵にだけ使え、クリティカルが出ると再使用が戻る。スティグマ「大地の懲罰」(Lv5)で断罪が確定クリティカル → 連打できる\n- 回復は攻撃力に比例して増える(治癒力強化)。なので攻撃寄りに組む\n\n### 3-2. スキルの上げ方と特化\n**上げる順番(Lucia): 大地の裁き・審判の雷 → 断罪 → 回復スキル。Lv45 でクエストを終える頃には全部 Lv12 を超える。Lv20 は断罪を最優先**(Welps: シーズン1は断罪だけ20にすれば十分。2つ目は聖杯の運しだい)\n\n| スキル | Lv8〜12 | Lv16 | Lv20 |\n|---|---|---|---|\n| 断罪(主力) | 2 対象が少ないほど+12%、4 クリティカル時に再使用初期化 | 4+5(5=必ず多段ヒット) | 2+4+5 |\n| 大地の裁き(左クリック) | 2 [放電]が出る確率+20%、4 [放電]的中時に霹靂の再使用 −7秒 | 2+4 | 2+3+4(3=多段ヒット) |\n| 審判の雷(右クリック) | 2 対象が少ないほど+12% | 2+5(5=[天罰]1回追加) | − |\n| 霹靂(溜めの大技) | 3 スキル速度+30%、4 対象が少ないほど+20% | +5 確定クリティカル | 3+4+5 |\n| 神聖な気(設置型の攻撃) | 3 発射速度+50%、4 持続+3秒 | 3+5(5=再使用 −10秒) | 3+4+5 |\n| 苦痛の連鎖(断罪の条件) | 2 持続+3秒、4 敵の PvE ダメージ耐性 −10% | − | − |\n| 弱化の烙印 | 2 敵の防御力 −15% | − | − |\n| 稲妻乱射(グロッキー中だけ) | − | 4+5(5=全スキルの再使用 −1秒)。16 で止める | − |\n| 快癒の光輝(全体回復) | 2 連続+1回、3 再使用 −3秒 | 3+5(5=HP5%) | 2+3+5 |\n| 治癒の光(単体回復) | 1 連続+2回、4 HP2% | 1+5(5=再使用 −2秒) | 1+4+5 |\n| 再生の光(持続回復) | 3 受ける治癒量+5%、2 HP50%以下で+20% | 3+5(5=ダメージ耐性+5%)。Krix は 4+5(移動速度) | − |\n\n### 3-3. パッシブ\n**神の恩恵(強打)= 大地の恩恵(クリティカル ダメージ)= 治癒力強化** を先に上げる(Krix、Lucia)。序盤は不死の帳(防御)も役立つ。回復遮断は使わない\n\n### 3-4. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| 大地の懲罰 | **20(最優先)** | 5で断罪が確定クリティカル。20で効果時間+10秒(断罪を打てる時間が延びる) |\n| 増幅の祈り | 20(2番目) | PvE ダメージ増幅+20%。20で攻撃力+15% |\n| 保護の光 | 3番目に20 | **チャンターがいない時**に入れる(チャンターのマントラと重ならないため外す) |\n| 高潔な気 | 5〜10 | 火力用。10で弱化の烙印の敵に+20%。チャンターがいる時は3番目の20にする(Welps) |\n\n- 入れ替え: 免罪(大回復。15で強い)、召喚復活(固定パーティーなら)、生命の権能(デバフが多いボス)\n- 戦闘速度・再使用短縮を積むほど断罪が途切れにくい。目安は再使用短縮33%だが、シーズン1では10〜11%が限界(Welps)\n\n### 3-5. おすすめマクロ\n**右クリックのマクロ(Lucia の形を基本に、Krix・Welps の変更を反映)**\n| 段 | 中身(上から順に試す) |\n|---|---|\n| 1 | (増幅の祈り)→ 大地の懲罰 → 苦痛の連鎖 → 断罪 |\n| 2 | 神聖な気 → 審判の雷 |\n\n- 開幕: 増幅の祈り → 大地の懲罰 → 苦痛の連鎖 → 霹靂を最大まで溜める → 左クリックとマクロを押し続ける。霹靂は再使用が戻るたびに手で最大まで溜める\n- 増幅の祈りは、気楽に回すならマクロに入れる。狙って使うなら外して手で押す(Krix)\n- **大地の懲罰が Lv20 になったら、ボス戦では審判の雷をマクロから外す**。審判の雷が断罪の動きを止めてしまうため。外すと左クリックが増え、放電 → 霹靂の再使用短縮も増える。ただし断罪と霹靂が16になる前は差が出にくい(Welps)。雑魚狩りでは審判の雷を残す\n- 苦痛の連鎖が切れている6〜7秒は、断罪が使えないので左クリックと審判の雷でつなぐ\n- 稲妻乱射は押さない。グロッキー中に断罪が出ない時だけ使う\n- MP が足りなくなりやすい。アルカナの魔力セット(2個)か MP ポーションで補う(Krix)\n\n### 3-6. 刻印・アルカナ・その他\n- 武器・ガーダー: 武器ダメージ増幅、威力、戦闘速度、正確(Lucia)\n- アクセサリー: 戦闘速度、威力、正確。1枠に神の恩恵か大地の恩恵\n- リング: 断罪、快癒の光輝(どちらも20にしたいスキル)。ただし**リングの刻印は最後**。武器 → ガーダー → 防具 → ほかのアクセサリーが先(Welps)\n- アルカナ(Welps): 鐘は魔力(破壊=攻撃力)で神の恩恵が高い物、鏡は活力(幻想=再使用短縮)で大地の恩恵、コンパスは神聖な気+4 が理想、聖杯は活力(時間)で断罪付き、羊皮紙は断罪付きなら全部とっておく。目標は断罪にアルカナで+4\n- 命中とクリティカルは、ルドラに行くなら各1,000以上(Lucia)\n- ペット: 1・5番=攻撃力、2・8番=HP、3・6・9番=命中(またはクリティカル)、4番=ダメージ増幅系、特殊ペットの4番は強打(Krix)\n\n---\n\n## 4. 3職業の比較\n| | レンジャー | チャンター | クレリック |\n|---|---|---|---|\n| 最初に20にする物 | スティグマ: バイゼルの権能 | スキル: 岩撃砕 | スティグマ: 大地の懲罰 / スキル: 断罪 |\n| 主力 | 必中の矢、速射 | 岩撃砕+貫通砕 | 断罪 |\n| 大事なパッシブ | 集中の眼、ハンターの決意、ハンターの魂 | 風の約束、攻撃準備、衝撃的中 | 神の恩恵、大地の恩恵、治癒力強化 |\n| 手で押す物 | 必中の矢(溜め)、標的の矢 | 疾風の権能、突進撃破、快癒の呪文 | 霹靂(溜め)、回復スキル |\n| クリティカル | 上限50%にすぐ届く | 要らない(確定クリティカル) | 断罪は確定。大地の恩恵でダメージを伸ばす |\n| 強い時期 | 装備が揃ってから | 早い時期から | 大地の懲罰20から |\n\n## 5. 確かめていないこと\n- マクロの段の並びは、字幕と資料の文章から起こした。画面の画像(JOHNPAL の資料の図、各動画の画面)は見ていない\n- レンジャーのスティグマの配り方の表は、資料の列の見出しと数字がずれていて、対応がやや不確か\n- クレリックの「チャンターと重ならない」スティグマ: Krix は「マントラ」と言っており、保護の光を指すと読んだ(Welps・Lucia の話とは合う)\n- 森の精霊の羽など、羽・称号の日本語名は確かめていない(英語の直訳)\n"},{"id":"tools","tab":"ツール","title":"ツール まとめ","file":"ツールのまとめ.md","md":"# ツール まとめ(2026-10-24 整理)\r\n\r\n「外部ツールまとめ_2026-10-21」と「NotMeter_設定方法」を1本にした(中身は 10/21 時点のまま。古い版は `_古い版/`)。\r\n- 種族理解度・アルカナ・魂刻印の上位20人の採用率は NotMeter のサイト(notmeter.com)で見られる\r\n\r\n海外で人気のツールのうち、**日本語で使えるもの**を中心にまとめた。海外動画(DrybearGamers「DPS メーターは使っていいか」、Mano Imp「ビルドを探せるサイト」)とウェブ検索から。日本語対応は実際にサイトを開いて確かめた。\r\n\r\n## まず使うならこの3つ\r\n\r\n| ツール | 日本語 | アリエル鯖 | できること | おすすめの使い方 |\r\n|---|---|---|---|---|\r\n| **GameWith AION2 TOOLS**\u003cbr\u003ehttps://gamewith.ai/aion2/ja | ○ | ○(サーバー選択に「アリエル」あり) | キャラ検索(装備・能力値・ディーヴァニオン・スキル)、**ビルド統計**(上位プレイヤーの装備・スキルLv・ボード・称号などの採用率を職業別・地域別に)、強化・魂の刻印・**アルカナのオプション**・翼・神石・魔石のシミュレーター | 上位テンプラーが何を選んでいるかを数字で見る。強化に要るギーナ・強化石の期待値を事前に計算する |\r\n| **questlog.gg**\u003cbr\u003ehttps://questlog.gg/aion-2/ja | ○ | (検索機能なし) | 職業別のビルド集、キャラクタービルダー、スキルビルダー、ディーヴァニオン、アイテム DB、ドレッシングルーム、マップ、ボスの時刻表、チェックリスト | 海外配信者のビルドを見る(**Xia が動画で「クエストログに載せた」と言っているのはこのサイト**) |\r\n| **ゲーム内の戦闘分析**(公式)\u003cbr\u003ePC で Ctrl+X | ○ | ― | 自分だけのダメージ内訳(スキルごと、クリティカル、外れ)。録画ボタンを押した間だけ記録 | マクロや特化を変えたときの比較。**公式なので規約の心配なし** |\r\n\r\n## ほかの日本語対応サイト\r\n\r\n| ツール | できること |\r\n|---|---|\r\n| Metabot https://metabot.gg/ja/aion-2 | データベース(職業・装備・ボス・隠しキューブ・マップ)、ディーヴァニオンの計画 |\r\n| Guild Order https://guildorder.com/ja/games/aion2 | キャラクタービルダー、ディーヴァニオン、スキルバー、製作計算、イベントのタイマー。作った物を URL で共有できる |\r\n| Game8 https://game8.jp/aion2 、wikiwiki https://wikiwiki.jp/vipdeaion2/ | 日本語の攻略記事と wiki(日本語名の確認に使っている) |\r\n\r\n## 英語だけだが便利なもの(すでに使っている物を含む)\r\n\r\n| ツール | できること |\r\n|---|---|\r\n| Aion2Market https://aion2.exchange/ | 取引所の相場と履歴(相場ボードのデータ元) |\r\n| AION2 Hub https://aion2hub.com/ | 製作計算、アイテム DB |\r\n\r\n## DPS メーター(パーティー全員の火力を見る外部プログラム)— **使うなら自己責任**\r\n\r\n| ツール | 日本語 | アジア鯖 | 料金 | 特徴 |\r\n|---|---|---|---|---|\r\n| **Abyss Logs** https://abysslogs.com/ | ○(サイトは日本語で表示。9言語対応。メーター本体の画面は未確認) | ○ | 無料(寄付で運営) | パーティーのDPS・ボスHP・激昂タイマーを画面に重ねて表示、スキルとバフの時間軸、クリ率・背面率、記録の共有、地域別・ボス別ランキング、同じ戦闘力帯での比較。署名付きの配布(DrybearGamers の一押し) |\r\n| AionFlex https://aionflex.gg/ (aionflex.com は別会社) | ×(英語・韓国語・中国語のみ) | ○ | 無料、Pro は月 €4.49 | 機能が多い(キャラ検索、ランキング、PvP、イベントのタイマー)。一部は Pro だけ |\r\n| LagoFast | 有料(回線最適化ソフトのおまけ) | ブラジルの配信者がスポンサーとして紹介 |\r\n\r\n### 3つの DPS メーターの比較(2026-10-21 最終。おすすめは NotMeter)\r\n\r\n| | **NotMeter** | Abyss Logs | Shugo.GG App |\r\n|---|---|---|---|\r\n| 日本語 | **サイトもメーター本体も○**(9言語) | サイトは○(9言語)。メーター本体は未確認 | サイトとアプリ紹介は○ |\r\n| 人気・規模 | 今日使われているメーター 46,489台 | 記録された戦闘 1,129万件(今週 684万件) | ベータ版(v0.3.95) |\r\n| 料金 | 無料 | 無料(寄付すると保存容量が増える) | 無料 |\r\n| 更新 | 1.0.288(10/20) | 不明 | 自動更新 |\r\n| ライブ表示 | 全員の DPS、HPS(回復)、スキル別の詳細、**ボス討伐と狂暴化の予測時間** | 全員の DPS、ボス HP、狂暴化タイマー | 全員の DPS(今と平均)、割合 |\r\n| 戦闘の後 | 戦闘記録の保存、CP帯での順位・上位% | **スキルとバフの時間軸、スキルごとにかかっていたバフ、クリ率・背面率、開幕**をブラウザーで | レポート(回復・被ダメージ・バフ・消耗品・デス・ビルド)、**リプレイ**(位置と詠唱を再生) |\r\n| 共有 | 記録の共有 | ワンクリックで共有、見せる相手を選べる | チャットに貼れる |\r\n| ランキング | 地域別、**25K刻みの戦闘力帯**別、1分カカシ | 地域別・ボス別、同じ職業・戦闘力帯での位置 | サイトのランキング |\r\n| 育成の助け | **ステータス効率計算**(何を上げると一番伸びるか)、**上位20人の装備・スキル構成**、ボス耐性 | 職業の統計 | ― |\r\n| 戦闘の補助 | **バフ・クールタイム表示(パーティーの分も)**、ポーション・スクロール・デバフ、音声通知 | ― | 敵対値の警告 |\r\n| PvP | PvP メーターと統計 | ― | 闘技場・戦場・アビスの相手の情報、勝率、K/D |\r\n| その他 | フィールドボスの予定と通知、アーティファクト、オードの一覧、パーティー・キャラ照会、OBS、戦闘中だけ表示 | パーティー全員の装備スコア・戦闘力・準備状態 | **日課の自動チェックリスト**、ペットレーダー、マップ、タイマー、OBS |\r\n| キューブ探知 | なし | なし | なし |\r\n\r\n- どれも通信を読むので Npcap が要り、規約上はグレー(自己責任)。NotMeter は「DPS が低いことを理由に仲間を責めたり追い出したりすると処分の対象になりうる」と注意している\r\n\r\n### Shugo.GG と NotMeter(2026-10-21 追加調査)\r\n\r\n| | **Shugo.GG**(サイト+アプリ) | **NotMeter** |\r\n|---|---|---|\r\n| 作り | 海外(英語圏)の個人。サイト https://shugo.gg/ja と Windows アプリ(ベータ v0.3.95) | 韓国の個人開発。https://notmeter.com/ 、配布は GitHub(Not4You-Dev/NotMeter-Releases) |\r\n| 日本語 | **○ サイトもアプリ紹介も日本語**(8言語) | ○(最初は韓国語版を見て×と書いたが、サイトもメーター本体も日本語あり) |\r\n| アジア鯖 | ○(サイトのランキングにアジア・アリエルあり) | キャラ検索は「グローバル アジア」あり。ボス耐性の統計は韓国・台湾のみ |\r\n| 料金 | 無料(DPS メーターは今後も無料と明記。VIP 特典を予定) | 無料(広告あり) |\r\n| 入れ方 | Discord でサインイン → インストーラー。Npcap(通信を読む部品)が要る | zip をダウンロード。Npcap が要る |\r\n\r\n**Shugo.GG のサイト(入れる物なし、日本語)**:キャラ検索(アーモリー)、ランキング、ティアリスト、データベース、マップ、タイマー(時空の亀裂・リセットまでの時間)、ニュース、配信一覧\r\n\r\n**Shugo.GG アプリ(DPS メーター以上の機能)**\r\n| 機能 | 中身 |\r\n|---|---|\r\n| DPS メーター | 全員のダメージ・今と平均の DPS・割合をゲーム上に表示。戦闘ごとにレポート(回復、被ダメージ、バフ、消耗品、デス、スキルごとのビルド、グラフ)。結果をチャットに貼れる |\r\n| チェックリスト | ゲームの数字を読み取って、オードエネルギー・ダンジョン入場・鍵・ギーナとアビスポイントの上限・闘技場などをキャラごとに自動表示。取りこぼしそうな物を警告 |\r\n| リプレイ | ボス戦と PvP を、全員の位置・ボスの詠唱と危険範囲・HP 付きで再生 |\r\n| ペットレーダー | 足りないペットを落とす近くの敵を、距離と方向でゲーム上に表示 |\r\n| PvP | 闘技場・戦場・アビスで自動で PvP 表示。相手の職業・戦闘力・HP・バフ、勝率、K/D |\r\n| その他 | 敵対値(ヘイト)の警告、パーティー募集中の全員の戦闘力、マップ、イベントのタイマーと通知、配信用オーバーレイ |\r\n\r\n**NotMeter(DPS メーター+統計サイト)**\r\n| 機能 | 中身 |\r\n|---|---|\r\n| ダンジョン統計 | 職業別の上位25%の DPS / nDPS で並べた表 |\r\n| 職業の性能・TOP10・ランキング | 職業ごとの強さ、上位10人、褒められた数のランキング |\r\n| **セッティングガイド** | 上位20人の魔石・霊石・魂の刻印・アルカナ・スキルの採用率(6時間ごと更新) |\r\n| **ステータス効率計算** | メーターから自分の能力値をコピーして貼ると、どの能力を上げるとダメージが一番伸びるかを計算 |\r\n| ボス耐性の統計 | 強打・完璧の耐性の推定(韓国・台湾のデータ) |\r\n| その他 | フィールドボス、アーティファクトの状況、メーターの記録の共有、キャラ検索 |\r\n\r\n- 仕組み:ゲームに入り込まず、通信を読み取るだけ(DrybearGamers)\r\n- **規約上はグレー**:NCSOFT の規約に「許可されていないプログラムの使用」で垢BANになる場合があるとの項目がある。DPS メーターがそれに当たるとは書かれておらず、使って BAN された例も今のところ聞かない(同動画)。ただし方針が変われば対象になりうる\r\n- 自分の火力を知りたいだけなら、**公式の戦闘分析(Ctrl+X)で足りる**。他人と比べたいときだけ外部メーター\r\n\r\n## 隠しキューブ(ヒドゥンキューブ)探し\r\n\r\n| ツール | 日本語 | できること |\r\n|---|---|---|\r\n| **Metabot の隠しキューブのページ** https://metabot.gg/ja_JP/aion-2/hidden-cubes | ○ | 地域ごとの数(ベルテロン95・アルトガルド59・エルテネン26・モルヘイム26、計206個)、出現候補地を全部地図に表示(3,722か所)、**見つけた物にチェックを付けて進み具合を残せる**(このブラウザーの中だけに保存)、出るアイテム36種、鍵の入手先 |\r\n| Metabot Desktop(Windows、無料) | ○ | 上と同じ地図とチェック表をゲームの横の別ウィンドウで。チェックは手動。Overwolf 認証済み |\r\n| **Shugo.GG のマップ** https://shugo.gg/ja/map | ○ | 「隠しキューブ」の表示を選ぶと地図に出る(ベルテロン地方で1,440地点)。チェック機能は見当たらない。アプリを入れると、地図の印をゲームのミニマップに重ねられる |\r\n\r\n- キューブは決まった1か所ではなく、**複数の候補地のどこかに出る**。開けた後にまた出るが、時間も場所も決まっていない(Metabot)\r\n- ベルテロンとアルトガルド(天族側)のキューブは**鍵が要る**。エルテネン・モルヘイムは鍵なしでも開けられ、鍵を使うと報酬が良くなる\r\n\r\n### キューブを探知して知らせるツール(2026-10-21 調査)\r\nどれも**日本語なし・利用者がごく少ない個人製**。日本語の攻略サイト aion2-times.com は「運営ポリシーで禁止の不正プログラムに当たるおそれがある」として使わないよう勧めている。\r\n\r\n| ツール | 仕組み | 知らせ方 | 言語 | 規模 |\r\n|---|---|---|---|---|\r\n| AION2-Cube-Detector(GitHub: BeardBear33) | **ゲームの音だけを聞いて**、キューブの音の大きさを % で表示。キューブの横で5秒立って基準を覚えさせる | 画面上のバーと通知音 | 英語・チェコ語 | スター0、ソース公開 |\r\n| Cube Radar(GitHub: dr89mh) | 通信を読む(Npcap) | 画面上のレーダーに距離・方向・高さ。新しいキューブで音。**敵プレイヤーも表示** | ドイツ語のみ | スター0、ソース公開、署名なし。ヴェルテロンで確認 |\r\n| aion2cubedetector(GitHub: ayi-afk) | 通信を読む | 座標の一覧、コンパス、ミニマップ、通知音 | 不明 | スター1、試用7日 |\r\n| AionCore(GitHub: filvoch) | 通信を読む。DPS メーター兼用 | 80・50・25・10m で右・前・後ろを知らせる。他人が開けたことも通知 | 英・葡・西・独・仏・露(日本語なし) | スター4、ソース非公開、署名なし。南米鯖で確認 |\r\n\r\n- DPS メーターより危険度が高いと考えられる:普通は見えない物の位置が分かる(規約の「通常のユーザーにできない行為を可能にするプログラム」に近い)。Cube Radar の作者ページにも「NCSOFT のサポートはゲームデータを読むソフトを規約違反とみなす」との話が載っている\r\n\r\n## 注意\r\n- ゲーム内に重ねて表示するタイプ(Wikily など)と DPS メーターは、PC にプログラムを入れる。入れる前に配布元が正しいかを確かめる(DrybearGamers によると、署名のない配布物もあった)\r\n- サイトによって日本語名が違うことがある(GameWith は「キナ」、アジア鯖の表記は「ギーナ」)。まとめでは `用語対応表.md` の名前を使う\r\n- ここに載せた外部サイトは、どれも非公式\r\n\r\n---\r\n\r\n## NotMeter の入れ方と設定(v1.0.288)\r\n公式の使い方ガイド(日本語): https://notmeter.com/tutorial.html?lang=ja-JP\r\n\r\n### 安全確認の結果(2026-10-21)\r\n| 確認 | 結果 |\r\n|---|---|\r\n| 配布元 | 公式サイト notmeter.com が案内している GitHub(Not4You-Dev/NotMeter-Releases)の最新版 v1.0.288 |\r\n| ファイルの指紋(SHA256) | zip・exe とも GitHub に載っている値と一致(途中で書き換えられていない) |\r\n| zip の中身 | NotMeter.exe が1つだけ(126.6MB)。ほかのプログラムは入っていない |\r\n| Windows Defender | zip・exe とも「脅威なし」 |\r\n| VirusTotal | 67社中1社(Bkav Pro)だけが「W32.Malware」と判定。名前のない汎用判定で、署名のないファイルに出やすい誤検知とみられる。残り66社は問題なし |\r\n| 電子署名 | **なし**(開発元の署名がない)。そのため初回起動で Windows の警告が出る |\r\n\r\n\r\n### 入れ方\r\n1. **Npcap を入れる**(通信を読むための部品。公式 https://npcap.com/ から。NotMeter のサイトも npcap-1.89.exe を案内)。インストーラーの選択肢は初期のままでよい\r\n2. `NotMeter.exe` をダブルクリック。署名がないため「Windows によって PC が保護されました」と出たら、「詳細情報」→「実行」\r\n3. 初回はプライバシーの選択画面が出る。言語を **日本語** にし、3つを選ぶ(どれも任意。全部外しても使える)\r\n   - 戦闘統計の共有\r\n   - 自分のキャラクター名の公開(外すとランキングでは *** になる)\r\n   - 日別の利用統計\r\n4. AION2 を起動し、ワールドで移動か攻撃をする → メーターに自分の名前とサーバーが出れば接続できている\r\n5. 訓練用かかしかボスを攻撃して、ダメージの行が出るか確かめる\r\n\r\n### 基本の操作\r\n| やりたいこと | 方法 |\r\n|---|---|\r\n| 設定を開く | メーターにマウスを重ねる → スライダーのアイコン。押せないときは画面右下の「∧」→ NotMeter を右クリック → 設定 |\r\n| 位置を固定してクリックをゲームに通す | メーター上の**鍵**をクリック。外すときは **Alt を押しながら鍵をクリック** |\r\n| 見失った | 右下の NotMeter を右クリック →「メーターのウィンドウ位置をリセット」 |\r\n| 結果を貼る | メニューのカメラ → Discord などに Ctrl+V |\r\n| 戦闘記録を見る | メニューのノート |\r\n| 回復量も出す | 設定 → メーター → 表示項目 → HPS(初期は OFF) |\r\n\r\n- ゲームは**ボーダーレスウィンドウ**にする(排他的フルスクリーンだとメーターが出ないことがある)\r\n- ショートカットは初期は無効。設定 → ホットキーで「戦闘リセット」「表示切替」などを登録できる\r\n\r\n### テンプラー向けのおすすめ設定\r\n- **戦闘補助UI**(設定 → 戦闘補助UI → クイックスタート → 職業でテンプラーを選んで追加 → 保存)\r\n  - クールタイムを出したいもの:**懲罰**(審判と重ねないため)、戦場の旗、破滅のシールド、挑発\r\n  - バフを出したいもの:高潔の甲冑、懲罰の強化(+20%)\r\n  - 最初から全部 ON にしなくてよい。必要な物だけ選ぶ\r\n- **ステータス効率計算**:メーターの討伐記録の上にある「自分のステータスをコピー」(韓国語版の表記は「내 스탯 복사」。日本語の表記は未確認)→ notmeter.com の「ステータス効率」に貼る → どの能力を上げると一番伸びるかが出る(装備や製作の判断に使える)\r\n- **装備・スキル構成**(notmeter.com):上位20人のテンプラーの魔石・霊石・魂の刻印・アルカナ・スキルの採用率\r\n\r\n### つながらないとき\r\n1. ワールドで移動や攻撃をしながら、設定 → ネットワーク → アダプターを再検索。緑の「使用中」が出ればよい\r\n2. VPN や回線最適化ソフト(ExitLag など)を使っていると見えないことがある\r\n3. それでもだめなら、公式の WinDivert プラグインに切り替え(設定 → ネットワーク。展開後、完全終了して**管理者として**再起動)\r\n\r\n### 注意\r\n- 非公式ツール。規約上はグレーで、使うなら自己責任\r\n- DPS が低いことを理由に仲間を責めたり追い出したりすると、アカウントが処分の対象になりうる(NotMeter の注意書き)\r\n"},{"id":"terms","tab":"用語","title":"用語対応表","file":"用語対応表.md","md":"# 用語対応表(英語 → アジアサーバーの日本語名)\n\n- 作成: 2026-10-14。reports/ のまとめは、この表で日本語名に置き換えた\n- スキル名は Game8(https://game8.jp/aion2/822198)の表記。対応表は [テンプラー海外動画まとめ.md](テンプラー海外動画まとめ.md) の14章\n- 出典の略称:\n  - wikiA = VIPでAion2 Wiki(https://wikiwiki.jp/vipdeaion2/)\n  - wikiB = AION2攻略wiki(https://wikiwiki.jp/gget/AION2%E6%94%BB%E7%95%A5wiki)\n  - 動画 = 日本の投稿者の YouTube(NAHAKU、selegames など)。字幕は自動文字起こしなので、聞き間違いの可能性がある\n\n## 1. 確認できた名前\n\n### 通貨・課金\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Kinah | ギーナ | wikiA、動画 |\n| Quna | キューナ | wikiA |\n| Membership | クァイリン特級メンバーシップ(メンバーシップ) | wikiA |\n| Wind Breeze Merchant | そよ風商会 | wikiA |\n| Quna Exchange | キューナ交換所 | wikiA |\n| Battle Pass / Daeva Pass | ディーヴァパス | wikiA |\n| Call of the World(英語圏では Planet\u0027s Call とも) | 世界の呼びかけ | wikiA |\n| Mercenaries of Ischalgen | イスハルゲンの傭兵 | wikiA |\n| Resurrection Spirit Stone | 復活の精霊石 | wikiA |\n\n### ダンジョン・コンテンツ\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Expedition / Exploration / Conquest | 遠征 / 探険 / 征服 | wikiA |\n| Kraocave | クラオ洞窟 | wikiA |\n| Dropnir | ドラウプニル | wikiA |\n| Uruguru Canyon | ウルググ峡谷 | wikiA |\n| Vakron Sky Island | バクロンの空中島 | wikiA |\n| Fire Temple | 炎の神殿 | wikiA |\n| Ferocious Horn Den | 獰猛な角岩窟 | wikiA |\n| Transcendence | 超越(ステージ → 「〇段階目」) | wikiA、動画 |\n| Shattered Arkanis / Deus Research Base | 砕けたアルカニス / デウス研究基地 | wikiA |\n| Nightmare / Ascension Trial | 悪夢 / 覚醒戦 | wikiA |\n| Sanctuary(Ludra) | 聖域(ルドラ) | wikiA、動画 |\n| Shugo Festival | シューゴフェスタ | wikiA |\n| Space-Time Rift | 時空の亀裂 | wikiA、動画 |\n| Supply Request | アビス補給依頼(補給依頼) | wikiA |\n| Pity reward | 天井(確定報酬) | 動画 |\n| Gear Change Voucher | 装備変更券 | 動画 |\n| Kromede(炎の神殿の武器) | クロメデ | wikiB |\n\n### システム\n| 英語 | \n| Wrathful Will / Wrathful Ego | 怒りの意志 / 怒りの自我(英語からの直訳。未確認) |\n| Star / Dark Dragon Lord(中間の段) | 真龍王 / 黒龍王。英語版の段の名前と日本語版の対応がはっきりしない |\n| Sync(1行の振り直し) | シンク |\n| Philosopher\u0027s Stone / Soul Fusion Stone(追加の行) | 賢者の石 |\n| Transfer Stone | 継承用の石 |\n| Balaur\u0027s Essence ほか竜族の素材 | 龍族の精髄(10/21 確認)、龍族の素材 |\n| Fine Thick / Hard / Durable Balaur Horn | 精錬された分厚い / 硬い / 堅固な龍族の角(10/21 確認) |\n| Artisan\u0027s Ultimate Refining Stone | 達人の最上級精錬石(2026-10-21 questlog.gg の日本語版データで確認) |\n| Radiant Orichalcum Ore(Pure / Fine は純粋な / 高純度の) | 煌めくオリハルコン鉱石(純粋な / 高純度の も 10/21 確認) |\n| Dragon Lord の段の名前 | True=真龍王、White=白龍王、Star=乾龍王、Dark=黒龍王、Wise=冥龍王、Ebony=闇龍王(10/21 questlog.gg で英日を番号で突き合わせ) |\n| Expert\u0027s / Artisan\u0027s Refining Stone の色との対応 | 青の精錬石、達人の精錬石(職人の精錬石・達人の精錬石という名前はある) |\n| Stigma Shard | スティグマのかけら |\n| Black Cloud Merchant | 黒雲商人 |\n| 悪夢のボス名(ジケル以外) | ピノピ、フェルク、ノトゥン、ジゼル、ジェロッドなど(カタカナ読み) |\n| Perfect / Double Chance | 完璧 / **強打**(2026-10-23 questlog.gg の英日のスキル特化文で確認。以前の「二重攻撃」は誤り) |\n| Longsword / Ring(装備の部位名) | **ロングソード / リング**(「長剣」「指輪」ではない。ガーダー・ネックレス・イヤリングはそのまま。10/21 questlog.gg と GameWith で確認) |\n| Greatsword / Dagger / Bow / Orb / Spellbook / Staff / Mace | グレートソード / ダガー / ボウ / オーブ / マジックブック / ワンド / メイス |\n| Gemstone(Fine / Pure / Radiant) | ルビーの原石、高純度の / 純粋な / 煌めくルビーの原石(サファイア・ダイヤモンドも同じ形) |\n| Aria / Azpha / Calendula / Targena(採集の草) | アンゼリカ / アンヌス / カレンドラ / タラゴン |\n| Enhanced Balaur Scale / Tanned Balaur Leather | 強化された分厚い・硬い・堅固な龍族の鱗 / なめした分厚い・硬い・堅固な龍族の皮 |\n| 名前の確かめ方 | questlog.gg の API `database.getItem`(id=Aion2Market の item_key、language=ja)で正式名が取れる |"}]};
const DOCS = GUIDE.docs;
const $ = s => document.querySelector(s);
const tabsEl = $('.tabs'), docEl = $('.doc'), tocEl = $('.toc'), resEl = $('.results'), qEl = $('#q');
let current = null;

$('#built').textContent = GUIDE.built ? '(更新: ' + GUIDE.built + ')' : '';

// Map a markdown link target or code span (a local .md/.html path) to one of the tabs.
function docForPath(p) {
  if (!p) return null;
  let s = p.replace(/^<|>$/g, '');
  try { s = decodeURIComponent(s); } catch (e) {}
  const base = s.split(/[\\/]/).pop();
  if (/\.html$/.test(base)) return DOCS.find(d => d.id === 'pet') || null;
  return DOCS.find(d => d.file === base) || null;
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(md) {
  if (window.marked) return marked.parse(md, { gfm: true });
  return '<pre style="white-space:pre-wrap">' + esc(md) + '</pre>';
}

function show(id, headingIndex) {
  const d = DOCS.find(x => x.id === id) || DOCS[0];
  current = d.id;
  for (const b of tabsEl.children) b.setAttribute('aria-selected', b.dataset.id === d.id ? 'true' : 'false');
  resEl.hidden = true; docEl.hidden = false; tocEl.hidden = false;
  docEl.innerHTML = render(d.md);

  // Headings get stable ids in document order; the search uses the same order.
  const hs = docEl.querySelectorAll('h1, h2, h3, h4');
  hs.forEach((h, i) => { h.id = d.id + '-' + i; if (h.tagName === 'H2' && /結論|今の|まず/.test(h.textContent)) h.classList.add('key'); });
  tocEl.innerHTML = '';
  docEl.querySelectorAll('h2').forEach(h => {
    const a = document.createElement('a'); a.href = '#' + d.id + '/' + h.id.split('-').pop();
    a.textContent = h.textContent.replace(/[((].*?[))]/g, '').trim(); tocEl.appendChild(a);
  });

  // Wide tables scroll inside their own box instead of widening the page.
  docEl.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t); });

  // Links and code spans that point at another note become tab switches.
  docEl.querySelectorAll('a[href]').forEach(a => {
    const target = docForPath(a.getAttribute('href'));
    if (target && !/^https?:/.test(a.getAttribute('href'))) { a.href = '#' + target.id; a.classList.add('tab-link'); }
    else if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  docEl.querySelectorAll('code').forEach(c => {
    const target = /\.(md|html)$/.test(c.textContent) ? docForPath(c.textContent) : null;
    if (target) { const a = document.createElement('a'); a.href = '#' + target.id; a.className = 'tab-link'; a.textContent = target.title; c.replaceWith(a); }
  });

  if (headingIndex != null) {
    const h = document.getElementById(d.id + '-' + headingIndex);
    if (h) { h.scrollIntoView({ block: 'start' }); h.classList.add('flash'); return; }
  }
  window.scrollTo({ top: 0 });
}

function route() {
  const m = location.hash.slice(1).split('/');
  if (qEl.value.trim()) { qEl.value = ''; }
  show(m[0] || DOCS[0].id, m[1] != null ? Number(m[1]) : null);
}

// Search: every line of every note, grouped under the heading it belongs to.
function search(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { show(current || DOCS[0].id); return; }
  docEl.hidden = true; tocEl.hidden = true; resEl.hidden = false;
  const hits = [];
  for (const d of DOCS) {
    let hIndex = -1, hText = d.title;
    for (const line of d.md.split('\n')) {
      const hm = line.match(/^(#{1,4})\s+(.*)/);
      if (hm) { hIndex++; hText = hm[2]; }
      const low = line.toLowerCase();
      if (words.every(w => low.includes(w))) hits.push({ d, hIndex, hText, line });
      if (hits.length > 200) break;
    }
  }
  if (!hits.length) { resEl.innerHTML = '<p class="none">見つかりませんでした</p>'; return; }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  resEl.innerHTML = '<p class="none">' + hits.length + '件</p>' + hits.slice(0, 120).map(h => {
    const plain = h.line.replace(/<!--.*?-->/g, '').replace(/[*`#>|]/g, ' ').replace(/\s+/g, ' ').trim();
    const snip = esc(plain.length > 160 ? plain.slice(0, 160) + '…' : plain).replace(re, '<mark>$1</mark>');
    const where = esc(h.d.title + (h.hIndex >= 0 ? ' › ' + h.hText.replace(/[*`]/g, '') : ''));
    return '<a class="hit" href="#' + h.d.id + (h.hIndex >= 0 ? '/' + h.hIndex : '') + '"><div class="where">' + where + '</div><div class="snip">' + snip + '</div></a>';
  }).join('');
}

for (const d of DOCS) {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = d.id; b.textContent = d.tab;
  b.addEventListener('click', () => { if (location.hash === '#' + d.id) route(); else location.hash = d.id; });
  tabsEl.appendChild(b);
}
let timer;
qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(qEl.value.trim()), 150); });
window.addEventListener('hashchange', route);
route();
</script>

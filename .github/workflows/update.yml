name: update-prices

# Every 15 minutes, starting a few minutes after Aion2Market's hourly snapshot (around :09 UTC).
# GitHub delays or drops scheduled runs under load, so the extra runs are retries; they exit in\n# under a minute when the snapshot is already on the site.
# The script asks for the home server only and exits without changes when there is no new
# snapshot; the other servers are refreshed every 6 hours. Data is deployed straight to
# GitHub Pages (not committed), so the repository does not grow.
on:
  schedule:
    - cron: '14,29,44,59 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Refresh every server now'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # a full refresh of every server can take 15-20 minutes on GitHub
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the data now on the site
        run: |
          mkdir -p data
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          curl -fsS "$base/items.json" -o data/items.json || rm -f data/items.json
          curl -fsS "$base/crafts.json" -o data/crafts.json || rm -f data/crafts.json

      - name: Fetch prices
        id: fetch
        shell: pwsh
        run: |
          if ('${{ inputs.full }}' -eq 'true') { ./fetch_market.ps1 -Full } else { ./fetch_market.ps1 }

      - name: Upload site
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deploy
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
